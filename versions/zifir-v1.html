  player.kills++; save.kills++;
  gainXP({sol:20,hound:15,sui:15,elite:80,col:100,boss:400}[e.kind]||15);
  gainMastery(player.weapons[player.wi],{sol:12,hound:8,sui:8,elite:40,col:60,boss:200}[e.kind]||8);
  blood(e.x,e.y,14);
  if(e.kind==='sui'){ explosion(e.x,e.y,46,55,0); }
  const credMul=hasPerk('yagmaci')?1.3:1;
  if(e.credits>0)pickups.push({x:e.x+R(-4,4),y:e.y+R(-4,4),type:'credit',val:Math.round(e.credits*credMul),bob:R(0,TAU)});
  if(e.kind==='sol'&&rand()<0.22)pickups.push({x:e.x+R(-8,8),y:e.y+R(-8,8),type:'med',val:0,bob:R(0,TAU)});
  if((e.kind==='sol'&&rand()<0.18)||e.kind==='elite')
    pickups.push({x:e.x+R(-6,6),y:e.y+R(-6,6),type:'keycard',val:0,bob:R(0,TAU)});
  objProgress('kills',1);
  if(e.kind==='elite'){
    pickups.push({x:e.x,y:e.y,type:'artifact',val:Math.round(400*SEC.loot),bob:0});
    if(rand()<0.35)pickups.push({x:e.x+8,y:e.y+8,type:'mod',mod:randModKey(),bob:0});
    addMsg('ELİT MUHAFIZ İNDİRİLDİ — artefaktını düşürdü!');
  }
  if(e.kind==='col'){
    const L=save.lostLoot||{credits:0,arts:0};
    if(L.credits>0)pickups.push({x:e.x,y:e.y,type:'credit',val:L.credits,bob:0});
    for(let i=0;i<Math.min(L.arts,4);i++)
      pickups.push({x:e.x+R(-12,12),y:e.y+R(-12,12),type:'artifact',val:Math.round(300*SEC.loot),bob:R(0,TAU)});
    save.lostLoot=null; persist(); markAch('collector');
    addMsg('!! THE COLLECTOR DÜŞTÜ — kaybettiklerin geri döndü !!');
  }
  if(e.kind==='boss'){
    explosion(e.x,e.y,90,40,0);
    for(let i=0;i<3;i++)pickups.push({x:e.x+R(-16,16),y:e.y+R(-16,16),type:'artifact',val:Math.round(400*SEC.loot),bob:R(0,TAU)});
    for(let i=0;i<2;i++)pickups.push({x:e.x+R(-20,20),y:e.y+R(-20,20),type:'mod',mod:randModKey(),bob:R(0,TAU)});
    pickups.push({x:e.x+14,y:e.y,type:'perk',perk:PERKKEYS[RI(0,PERKKEYS.length-1)],bob:0});
    pickups.push({x:e.x,y:e.y,type:'credit',val:Math.round(500*SEC.loot),bob:0});
    save.coreCleared=(save.coreCleared||0)+1; persist(); markAch('boss'); bossKilledThisRaid=true;
    addMsg('!! THE SOURCE SUSTURULDU — Zone bir an nefes aldı !!');
    addMsg('Çekirdek ganimeti yerde. EXTRACTION seni bekliyor.');
  }
}
function damagePlayer(dmg,src,sx,sy){
  if(state!=='play')return;
  if(isTouch)vib(35);
  if(sx!==undefined)dmgDirs.push({a:Math.atan2(sy-player.y,sx-player.x),t:0.9});
  if(dmgDirs.length>6)dmgDirs.shift();
  let mul=(OPERATORS[save.operator]||OPERATORS.sentinel).dmgTaken||1;
  if(player.bastionT>0)mul*=0.4;
  if(hasPerk('zirhli'))mul*=0.88; // Sert Deri perki
  mul*=diff().dmgMul; // zorluk modu
  dmg*=mul;
  // zırh plakası: kalan havuz kadar %25 emer
  if(player.plate>0){
    const red=Math.min(player.plate,dmg*0.25);
    dmg-=red; player.plate-=red;
    if(player.plate<=0){ player.plate=0; addMsg('ZIRH PLAKASI KIRILDI'); SFX.dry(); }
  }
  player.hp-=dmg; hurtFlash=0.5; shake=Math.min(shake+4,12); SFX.hurt();
  player.lastHits.push({src:src||'Bilinmeyen',dmg:Math.round(dmg)});
  if(player.lastHits.length>4)player.lastHits.shift();
  blood(player.x,player.y,5);
  if(extract.t>0){ extract.t=0; addMsg('Extraction kesintiye uğradı — hasar aldın!'); }
  if(player.hp<=0){
    player.hp=0; state='dying'; deathT=0.9; SFX.death();
    deathInfo={src:src||'Bilinmeyen',hits:player.lastHits.slice()};
    recordLoss();
    save.raids++; persist();
  }
}
// Kaybedilen ganimet The Collector'a gider. Ölümde eklentiler de yiter;
// raid'i terk etmede korunur (canlı çıktın — teçhizatın üstünde).
function recordLoss(wipeAttach){
  // Hikâye modu: hiçbir şey kaybedilmez
  if(diff().lossMul===0){ save.credits+=player.credits; return; }
  // Güvenli Kasa: ölümde bir miktar kredi kurtulur (Collector'a gitmez)
  const saved=Math.min(player.credits,(save.hideout.kasa||0)*150);
  const lostCred=player.credits-saved;
  const L=save.lostLoot||{credits:0,arts:0};
  L.credits+=lostCred; L.arts+=player.artifacts;
  save.lostLoot=(L.credits>0||L.arts>0)?L:null;
  if(saved>0)save.credits+=saved;
  if(wipeAttach!==false){
    // Atölye: N eklenti sigortalı — silahtan ilk N mod korunur
    const keep=(save.hideout.atolye||0);
    if(keep>0){
      const kept={};
      for(const wk in player.attach){
        if(player.attach[wk]&&player.attach[wk].length){
          kept[wk]=player.attach[wk].slice(0,keep);
        }
      }
      save.attach=kept;
    } else save.attach={};
  }
}

// ---------- KEY / MOUSE HANDLERS ----------
function onKeyDown(code){
  if(state==='menu'){
    if(code==='Enter')startRaid();
    if(code==='KeyO'){ selOpIdx=Math.max(0,OPKEYS.indexOf(save.operator)); state='opselect'; SFX.pickup(); }
    if(code==='KeyB'){ selSecIdx=clamp(save.sector,0,save.maxSector); state='secselect'; SFX.pickup(); }
    if(code==='KeyM'){ state='market'; SFX.pickup(); }
    if(code==='KeyG'){ selHideIdx=0; state='hideout'; SFX.pickup(); }
    if(code==='KeyC'){ state='codex'; SFX.pickup(); }
    if(code==='KeyJ'){ state='journal'; SFX.pickup(); }
    if(code==='KeyY'){ selSetIdx=0; state='settings'; SFX.pickup(); }
    if(code==='KeyL'){ save.lang=save.lang==='en'?'tr':'en'; persist(); SFX.pickup(); }
    if(code==='KeyT')startRaid({daily:true});
    return;
  }
  if(state==='market'){
    const buy=(cost,fn)=>{ if(save.credits>=cost){ save.credits-=cost; fn(); persist(); SFX.pickup(); } else SFX.dry(); };
    if(code==='Digit1')buy(150,()=>save.stash.med++);
    if(code==='Digit2')buy(100,()=>save.stash.ammo++);
    if(code==='Digit3')buy(250,()=>save.stash.plate++);
    if(code==='Digit4'&&!save.shotgun)buy(800,()=>save.shotgun=true);
    if(code==='Digit5'&&!save.sniper)buy(1500,()=>save.sniper=true);
    if(code==='Digit6'&&!save.smg)buy(700,()=>save.smg=true);
    if(code==='Digit7'&&!save.dmr)buy(1100,()=>save.dmr=true);
    if(code==='Digit8'&&!save.lmg)buy(1300,()=>save.lmg=true);
    if(code==='Escape')state='menu';
    return;
  }
  if(state==='hideout'){
    if(code==='KeyW'||code==='ArrowUp'){ selHideIdx=(selHideIdx+HIDEOUT.length-1)%HIDEOUT.length; SFX.geiger(); }
    if(code==='KeyS'||code==='ArrowDown'){ selHideIdx=(selHideIdx+1)%HIDEOUT.length; SFX.geiger(); }
    if(code==='Enter'){
      const h=HIDEOUT[selHideIdx], lv=save.hideout[h.k]||0;
      if(lv>=h.max)SFX.dry();
      else if(save.credits>=h.cost[lv]){ save.credits-=h.cost[lv]; save.hideout[h.k]=lv+1; persist(); SFX.artifact(); }
      else SFX.dry();
    }
    if(code==='Escape')state='menu';
    return;
  }
  if(state==='settings'){
    const S=save.settings, keys3=['sfx','music','shake']; // 0-2 slider
    const dkeys=['story','stalker','veteran'];
    const N=10; // sfx,music,shake,difficulty,dmgNums,crt,flash,haptics,dil,hassasiyet
    if(code==='KeyW'||code==='ArrowUp'){ selSetIdx=(selSetIdx+N-1)%N; SFX.geiger(); }
    if(code==='KeyS'||code==='ArrowDown'){ selSetIdx=(selSetIdx+1)%N; SFX.geiger(); }
    const dir=(code==='KeyA'||code==='ArrowLeft')?-1:(code==='KeyD'||code==='ArrowRight')?1:0;
    if(dir!==0){
      if(selSetIdx<3){ S[keys3[selSetIdx]]=clamp(Math.round((S[keys3[selSetIdx]]+dir*0.1)*10)/10,0,1.5); applyAudioSettings(); persist(); }
      else if(selSetIdx===3){ let di=dkeys.indexOf(save.difficulty); di=(di+dir+3)%3; save.difficulty=dkeys[di]; persist(); }
      else if(selSetIdx===6){ S.flash=S.flash?0:1; persist(); }
      else if(selSetIdx===7){ S.haptics=!S.haptics; persist(); }
      else if(selSetIdx===8){ save.lang=save.lang==='en'?'tr':'en'; persist(); }
      else if(selSetIdx===9){ S.touchSens=clamp(Math.round((S.touchSens+dir*0.1)*10)/10,0.5,1.5); persist(); }
    }
    if(code==='Enter'){
      if(selSetIdx===4){ S.dmgNums=!S.dmgNums; persist(); SFX.pickup(); }
      else if(selSetIdx===5){ S.crt=!S.crt; persist(); SFX.pickup(); }
      else if(selSetIdx===6){ S.flash=S.flash?0:1; persist(); SFX.pickup(); }
      else if(selSetIdx===7){ S.haptics=!S.haptics; persist(); SFX.pickup(); vib(20); }
      else if(selSetIdx===8){ save.lang=save.lang==='en'?'tr':'en'; persist(); SFX.pickup(); }
    }
    if(code==='Escape')state='menu';
    return;
  }
  if(state==='codex'||state==='journal'){ if(code==='Escape'||code==='Enter')state='menu'; return; }
  if(state==='opselect'){
    if(code==='KeyA'||code==='ArrowLeft'){ selOpIdx=(selOpIdx+OPKEYS.length-1)%OPKEYS.length; SFX.geiger(); }
    if(code==='KeyD'||code==='ArrowRight'){ selOpIdx=(selOpIdx+1)%OPKEYS.length; SFX.geiger(); }
    if(code==='Enter'){
      const k=OPKEYS[selOpIdx], cost=OPERATORS[k].cost||0;
      if(save.ops[k]){ save.operator=k; persist(); SFX.pickup(); state='menu'; }
      else if(save.gems>=cost){
        save.gems-=cost; save.ops[k]=true; save.operator=k; persist();
        SFX.artifact(); opMsg=OPERATORS[k].name+' AÇILDI!'; opMsgT=performance.now();
      } else {
        SFX.dry(); opMsg='Yetersiz elmas — '+cost+' gerekli (sende ◆'+save.gems+')'; opMsgT=performance.now();
      }
    }
    if(code==='Escape')state='menu';
    return;
  }
  if(state==='secselect'){
    if(code==='KeyW'||code==='ArrowUp'){ selSecIdx=Math.max(0,selSecIdx-1); SFX.geiger(); }
    if(code==='KeyS'||code==='ArrowDown'){ selSecIdx=Math.min(SECTORS.length-1,selSecIdx+1); SFX.geiger(); }
    if(code==='Enter'){
      if(selSecIdx<=save.maxSector){ save.sector=selSecIdx; persist(); SFX.pickup(); state='menu'; }
      else SFX.dry();
    }
    if(code==='Escape')state='menu';
    return;
  }
  if(state==='dying')return;
  if(state==='dead'||state==='extracted'){
    if(code==='Enter'){ state='menu'; endingShown=false; }
    if(code==='KeyC'&&state==='extracted'&&dailyMode){
      const share='ZİFİR Günlük Zone '+todayKey()+' — '+player.credits+' kr';
      try{ navigator.clipboard.writeText(share); addMsg('Skor panoya kopyalandı!'); }catch(e){}
      SFX.pickup();
    }
    return;
  }
  if(state!=='play')return;
  if(code==='KeyP'){ paused=!paused; return; }
  if(paused){
    if(code==='KeyY'){ selSetIdx=0; state='settings'; paused=false; }
    if(code==='Escape'){ // duraklatma menüsünden terk (çift onay)
      if(escAsk>0){ escAsk=0; paused=false; recordLoss(false); state='menu'; save.raids++; persist(); }
      else escAsk=4;
    }
    return;
  }
  if(code==='Escape'){
    if(escAsk>0){ recordLoss(false); state='menu'; save.raids++; persist(); }
    else { escAsk=2; addMsg('Raid\'i terk etmek için tekrar ESC — ganimet The Collector\'a gider.'); }
    return;
  }
  if(code==='Space')dash();
  if(code==='KeyE')useAbility();
  if(code==='KeyF')doInteract();
  if(code==='KeyH'){
    if(player.meds>0&&player.hp<player.maxhp){
      player.meds--; player.hp=clamp(player.hp+50,0,player.maxhp);
      SFX.pickup(); addMsg('MEDKIT kullanıldı (+50 HP) — kalan: '+player.meds);
    } else if(player.meds<=0)SFX.dry();
  }
  if(code==='KeyR')startReload();
  if(code.startsWith('Digit')){
    const n=parseInt(code.slice(5),10)-1;
    if(n>=0&&n<player.weapons.length){ player.wi=n; player.recIdx=0; player.charge=0; player.reloadT=0; }
  }
}
function onMouseDown(){
  if(state==='menu'){ return; }
  if(state==='play'&&!paused){
    player.latch=false;
  }
}
function onMouseUp(){
  if(state!=='play'||paused||!player)return;
  const wk=player.weapons[player.wi], w=WEAPONS[wk];
  if(w.charge&&player.charge>0){ fireWeapon(player.charge); player.charge=0; }
}
function cycleWeapon(d){
  player.wi=(player.wi+d+player.weapons.length)%player.weapons.length;
  player.recIdx=0; player.charge=0; player.reloadT=0; // dolum iptal — yanlış silaha dolum yapılmasın
}
function dash(){
  if(OPERATORS[save.operator].noDash){ SFX.dry(); return; }
  if(player.dashCD>0||player.stam<25)return;
  const mx=cam.x-VW/2+mouse.x, my=cam.y-VH/2+mouse.y;
  let dx=0,dy=0;
  if(keys.KeyW)dy-=1; if(keys.KeyS)dy+=1; if(keys.KeyA)dx-=1; if(keys.KeyD)dx+=1;
  if(dx===0&&dy===0&&touchJoy.active&&touchJoy.mag>0.12){ dx=touchJoy.x; dy=touchJoy.y; }
  if(dx===0&&dy===0){ const a=Math.atan2(my-player.y,mx-player.x); dx=Math.cos(a); dy=Math.sin(a); }
  const l=Math.hypot(dx,dy)||1;
  player.vx=dx/l*340; player.vy=dy/l*340;
  player.dashT=0.16; player.dashCD=0.9; player.inv=0.26; player.stam-=25;
  for(let i=0;i<6;i++)parts.push({x:player.x,y:player.y,vx:R(-20,20),vy:R(-20,20),life:0.3,max:0.3,col:'#6ee7ff',size:2,fric:3});
}
function startReload(){
  const wk=player.weapons[player.wi], w=WEAPONS[wk], a=player.ammo[wk];
  if(w.melee||player.reloadT>0||a.mag>=effMag(wk)||a.res<=0)return;
  player.reloadT=w.reload*masterReload(wk); SFX.reload();
}
// ---------- OPERATÖR YETENEKLERİ (E) ----------
function useAbility(){
  const p=player, key=save.operator, OP=OPERATORS[key];
  if(p.energy<OP.abCost){ addMsg('Yetersiz enerji — '+OP.abCost+' gerekli'); SFX.dry(); return; }
  p.energy-=OP.abCost;
  if(key==='sentinel'){
    p.bastionT=4; SFX.stun();
    addMsg('BASTION — gelen hasar %60 azaldı (4 sn)');
  }
  else if(key==='assassin'){
    p.stealthT=5; SFX.silenced();
    for(const e of enemies){
      if(e.state==='combat'){ e.state='invest'; e.tx=e.lastX; e.ty=e.lastY; }
      if(e.state==='chase')e.state='wander';
      e.seeT=0;
    }
    addMsg('GÖLGE — görünmezsin (5 sn)');
  }
  else if(key==='juggernaut'||key==='psionic'){
    const rr=key==='psionic'?110:80, dmg=key==='psionic'?8:22;
    for(const e of enemies){
      if(e.dead)continue;
      const d=dist(p.x,p.y,e.x,e.y);
      if(d<rr){
        const a=Math.atan2(e.y-p.y,e.x-p.x);
        moveCirc(e,Math.cos(a)*30,Math.sin(a)*30);
        e.stun=1.2;
        hurtEnemy(e,dmg,p.x,p.y);
      }
    }
    if(key==='psionic')bullets=bullets.filter(b=>b.from!=='e'||dist(b.x,b.y,p.x,p.y)>130);
    for(let i=0;i<24;i++){
      const a=i/24*TAU;
      parts.push({x:p.x+Math.cos(a)*12,y:p.y+Math.sin(a)*12,vx:Math.cos(a)*160,vy:Math.sin(a)*160,
        life:0.35,max:0.35,col:key==='psionic'?'#c47aff':'#ffb02a',size:2,fric:5});
    }
    shake=Math.min(shake+5,12); SFX.plasma();
    addMsg(key==='psionic'?'REZONANS DALGASI — mermiler silindi':'ŞOK DALGASI');
    if(key==='juggernaut')noiseEvent(p.x,p.y,160);
  }
  else if(key==='hunter'){
    p.markT=8; SFX.alert();
    addMsg('İZLEME — düşmanlar işaretlendi (8 sn)');
  }
  else if(key==='medic'){
    p.hp=clamp(p.hp+30,0,p.maxhp); p.stimT=4; SFX.pickup();
    addMsg('STİM — +30 HP, hız artışı (4 sn)');
  }
}
// ---------- SİLAH USTALIĞI ----------
function masteryLvl(wk){ return (save.mastery[wk]&&save.mastery[wk].lvl)||0; }
function masteryNext(lvl){ return 100+lvl*120; }
function gainMastery(wk,n){ if(!wk)return; player.masteryGain[wk]=(player.masteryGain[wk]||0)+n; }
function commitMastery(){
  for(const wk in player.masteryGain){
    if(!save.mastery[wk])save.mastery[wk]={xp:0,lvl:0};
    const m=save.mastery[wk]; m.xp+=player.masteryGain[wk];
    while(m.lvl<5&&m.xp>=masteryNext(m.lvl)){ m.xp-=masteryNext(m.lvl); m.lvl++; addMsg(WEAPONS[wk].name+' USTALIK '+m.lvl); }
  }
}
const masterRecoil=wk=>1-masteryLvl(wk)*0.04;
const masterReload=wk=>1-masteryLvl(wk)*0.03;
// ---------- GÖREV İLERLEMESİ & ETKİLEŞİM (F) ----------
function objProgress(id,n){
  for(const o of objectives){
    if(o.id!==id||o.done)continue;
    o.have+=n;
    if(o.have>=o.need){
      o.done=true;
      const rw=Math.round(o.reward*(1+(save.hideout.anten||0)*0.25)); // Anten bonusu
      player.credits+=rw;
      gainXP(60);
      addMsg('GÖREV TAMAM: '+o.txt+' (+'+rw+' kr, +60 XP)'); SFX.artifact();
    }
  }
}
// ---------- DİNAMİK OLAYLAR ----------
function fireEvent(type){
  const p=player;
  if(type==='storm'){
    for(const a of anomalies){
      const t=randReachTile(8,p.x/TILE,p.y/TILE);
      a.x=(t.x+0.5)*TILE; a.y=(t.y+0.5)*TILE;
    }
    shake=Math.min(shake+10,14); SFX.scream();
    for(let i=0;i<5;i++)setTimeout(()=>SFX.geiger(),i*90);
    addMsg('!! ANOMALİ FIRTINASI — anomaliler yer değiştirdi !!');
  } else if(type==='blackout'){
    for(const pr of props)if(pr.type==='lamp')pr.off=true;
    ambBonus=0.06; SFX.stun();
    addMsg('!! BLACKOUT — şebeke çöktü, karanlık derinleşti !!');
  } else {
    for(let i=0;i<3;i++){
      const t=randReachTile(15,p.x/TILE,p.y/TILE);
      const s=mkSoldier((t.x+0.5)*TILE,(t.y+0.5)*TILE);
      s.state='invest'; s.tx=p.x; s.ty=p.y; s.spd=60;
      enemies.push(s);
    }
    SFX.alert();
    addMsg('!! AVCI TİMİ SAHADA — son konumuna geliyorlar !!');
  }
}
function doInteract(){
  const pr=nearInteract;
  if(!pr)return;
  if(pr.type==='terminal'&&!pr.used){
    pr.used=true;
    const v=Math.round(R(40,90)*SEC.loot);
    player.credits+=v; gainXP(20); SFX.pickup();
    addMsg('VERİ ÇEKİRDEĞİ ÇEKİLDİ (+'+v+' kr)');
    const lt=LORE[RI(0,LORE.length-1)]; addMsg('» '+lt); recordLore(lt);
    objProgress('terminal',1);
  } else if(pr.type==='locker'){
    if(player.keycards>0){
      player.keycards--; pr.dead=true; gainXP(25); SFX.artifact();
      addMsg('KONTEYNER AÇILDI');
      pickups.push({x:pr.x+7,y:pr.y,type:'credit',val:Math.round(RI(120,220)*SEC.loot),bob:0});
      if(rand()<0.4)pickups.push({x:pr.x-7,y:pr.y,type:'perk',perk:PERKKEYS[RI(0,PERKKEYS.length-1)],bob:0});
      else pickups.push({x:pr.x-7,y:pr.y,type:'mod',mod:randModKey(),bob:0});
      if(rand()<0.45)pickups.push({x:pr.x,y:pr.y+8,type:'artifact',val:Math.round(300*SEC.loot),bob:0});
      else pickups.push({x:pr.x,y:pr.y+8,type:'med',val:0,bob:0});
      objProgress('locker',1);
    } else { SFX.dry(); addMsg('KİLİTLİ — anahtar kart gerekli (askerler taşır)'); }
  }
}

// ---------- FIRE ----------
const perkDmg=()=>hasPerk('vurucu')?1.15:1;
function meleeSwing(){
  const w=WEAPONS.knife;
  player.fireT=60/w.rpm;
  const mx=cam.x-VW/2+mouse.x, my=cam.y-VH/2+mouse.y;
  const ang=Math.atan2(my-player.y,mx-player.x);
  camKick.x-=Math.cos(ang)*3; camKick.y-=Math.sin(ang)*3;
  sfxAt(player.x,player.y,()=>noiseSfx(0.05,0.14,2200,3));
  let hit=false;
  for(const e of enemies){
    if(e.dead)continue;
    const d=dist(player.x,player.y,e.x,e.y);
    if(d<e.r+18&&Math.abs(angDiff(ang,Math.atan2(e.y-player.y,e.x-player.x)))<0.9){
      // sessiz eliminasyon: farkında olmayan hedefe 3x
      const unaware=(e.state==='patrol'||e.state==='wander')||player.stealthT>0;
      let dm=w.dmg*perkDmg()*(unaware?3:1);
      hurtEnemy(e,dm,player.x,player.y);
      sparks(e.x,e.y,5,'#ffdddd'); hit=true;
      if(unaware&&e.kind!=='boss'){ addMsg('SESSİZ ELİMİNASYON'); markAch('silentkill'); }
    }
  }
  parts.push({x:player.x+Math.cos(ang)*14,y:player.y+Math.sin(ang)*14,vx:0,vy:0,life:0.1,max:0.1,col:'#fff',size:3,fric:2});
  noiseEvent(player.x,player.y,10);
  gainMastery('knife',hit?12:2);
}
function fireWeapon(chargeMul){
  const wk=player.weapons[player.wi], w=WEAPONS[wk], a=player.ammo[wk];
  if(player.reloadT>0)return; // dolum sırasında ateş yok (şarj bırakma dahil)
  if(w.melee){ meleeSwing(); return; }
  if(a.mag<=0){ SFX.dry(); startReload(); return; }
  player.noFire=false; // ateşli silah kullanıldı (Hayalet başarımı için)
  a.mag--; player.fireT=60/w.rpm; player.shots++;
  const mx=cam.x-VW/2+mouse.x, my=cam.y-VH/2+mouse.y;
  let baseAng=Math.atan2(my-player.y,mx-player.x);
  // deterministik recoil + poligon + ustalık azaltması
  const recMul=(1-(save.hideout.poligon||0)*0.08)*masterRecoil(wk);
  const drift=recoilAt(wk,player.recIdx)*w.recoil*recMul;
  player.recIdx++; player.recRec=0.35;
  const mods=modsOf(wk);
  const mDmg=(mods.includes('supp')?0.92:1)*perkDmg();
  const mNoise=(mods.includes('supp')?0.35:1)*(hasPerk('hayalet')?0.7:1);
  const mRange=mods.includes('barrel')?1.4:1;
  const mSpeed=mods.includes('barrel')?1.15:1;
  const mSpread=(mods.includes('laser')?0.65:1)*recMul;
  const moving=(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||(touchJoy.active&&touchJoy.mag>0.12))?1.25:1;
  const spread=Math.max(w.spread*moving*(mouse.rdown?0.5:1)*mSpread, w.spread*0.3); // ADS+lazer alt sınırlı
  const mul=chargeMul!==undefined?(0.35+0.65*chargeMul):1;
  for(let i=0;i<w.pellets;i++){
    const ang=baseAng+drift+R(-spread,spread);
    bullets.push({x:player.x+Math.cos(ang)*8,y:player.y+Math.sin(ang)*8,
      vx:Math.cos(ang)*w.speed*mSpeed,vy:Math.sin(ang)*w.speed*mSpeed,
      dmg:w.dmg*mul*mDmg,from:'p',life:1.4,col:w.col,dist:0,range:w.range*mRange,
      pierce:(w.pierce&&(chargeMul===undefined||chargeMul>0.9)),
      shock:(w.shockEvery&&player.shots%w.shockEvery===0),
      smash:!!w.smash});
  }
  // görsel/işitsel geri bildirim — shake (yönsüz) + tepme (nişanın tersine)
  shake=Math.min(shake+w.kick*0.45,10);
  camKick.x-=Math.cos(baseAng)*w.kick*0.9;
  camKick.y-=Math.sin(baseAng)*w.kick*0.9;
  addLight(player.x+Math.cos(baseAng)*12,player.y+Math.sin(baseAng)*12,46,0.07,'255,220,150');
  parts.push({x:player.x+Math.cos(baseAng+0.5)*7,y:player.y+Math.sin(baseAng+0.5)*7,
    vx:Math.cos(baseAng+1.9)*40,vy:Math.sin(baseAng+1.9)*40,life:0.4,max:0.4,col:'#c8a850',size:1,fric:5});
  if(w.silenced)SFX.silenced(); else if(wk==='shotgun')SFX.shotgun(); else if(wk==='sniper')SFX.plasma(); else SFX.shot();
  setTimeout(()=>{ if(AC)noiseSfx(0.03,0.06,2800,2.5); },150+Math.random()*90); // kovan düşüşü
  noiseEvent(player.x,player.y,w.noise*mNoise*(OPERATORS[save.operator].noiseMul||1));
}
function enemyFire(e,tx,ty,spread,dmg,speed){
  const ang=Math.atan2(ty-e.y,tx-e.x)+R(-spread,spread);
  bullets.push({x:e.x+Math.cos(ang)*9,y:e.y+Math.sin(ang)*9,
    vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,dmg,from:'e',life:2,col:'#ff5a4a',srcKind:e.kind});
  addLight(e.x,e.y,30,0.06,'255,120,90');
  sfxAt(e.x,e.y,SFX.enemyshot);
}

// ---------- UPDATE ----------
let lastT=performance.now();
function update(dt){
  if(state!=='play')return; // savunma: extraction/ölüm sonrası çift işlem imkânsız
  raidT+=dt;
  if(escAsk>0)escAsk-=dt;
  // --- player ---
  const p=player;
  const wk=p.weapons[p.wi], w=WEAPONS[wk], am=p.ammo[wk];
  let dx=0,dy=0;
  if(keys.KeyW)dy-=1; if(keys.KeyS)dy+=1; if(keys.KeyA)dx-=1; if(keys.KeyD)dx+=1;
  if(touchJoy.active&&touchJoy.mag>0){ dx=touchJoy.x*touchJoy.mag; dy=touchJoy.y*touchJoy.mag; }
  const l=Math.hypot(dx,dy);
  const sprint=(keys.ShiftLeft||(touchJoy.active&&touchJoy.mag>0.94))&&l>0&&p.stam>1&&p.dashT<=0;
  let spd=p.speed*(sprint?1.55:1)*(p.stimT>0?1.3:1)*(mouse.rdown?0.6:1)*(raidMod&&raidMod.k==='dusukg'?1.22:1);
  if(touchJoy.active&&touchJoy.mag>0)spd*=clamp(touchJoy.mag*1.15,0.35,1); // analog hız
  if(l>0){dx/=l;dy/=l;}
  if(p.dashT>0){ p.dashT-=dt; moveCirc(p,p.vx*dt,p.vy*dt); }
  else moveCirc(p,dx*spd*dt,dy*spd*dt);
  p.dashCD-=dt; p.inv-=dt;
  p.stam=clamp(p.stam+(sprint?-22*dt*(hasPerk('maraton')?0.6:1):14*dt),0,100);
  const OPC=OPERATORS[save.operator]||OPERATORS.sentinel;
  p.energy=clamp(p.energy+5*dt,0,100);
  p.stealthT=Math.max(0,p.stealthT-dt);
  p.markT=Math.max(0,p.markT-dt);
  p.bastionT=Math.max(0,p.bastionT-dt);
  p.stimT=Math.max(0,p.stimT-dt);
  if(OPC.regen)p.hp=clamp(p.hp+OPC.regen*dt,0,p.maxhp);
  // ayak sesi + yürüyüş animasyonu
  p.stepT-=dt;
  if(l>0||p.dashT>0)p.walk=(p.walk||0)+dt*(sprint?15:10);
  if(l>0&&p.stepT<=0){ p.stepT=sprint?0.26:0.4; noiseEvent(p.x,p.y,(sprint?92:26)*(OPC.noiseMul||1)*(hasPerk('hayalet')?0.5:1)); }
  // anomali etkileri
  let inRad=false, nearRad=1e9;
  for(const a of anomalies){
    const d=dist(a.x,a.y,p.x,p.y);
    if(a.type==='rad'){ nearRad=Math.min(nearRad,d/a.r); if(d<a.r){inRad=true; p.hp-=7*dt*(OPC.radRes||1); p.lastEnv='Radyasyon'; hurtFlash=Math.max(hurtFlash,0.12);} }
    else { // grav
      if(d<a.r){ const f=(1-d/a.r)*150; const ang=Math.atan2(a.y-p.y,a.x-p.x);
        moveCirc(p,Math.cos(ang)*f*dt,Math.sin(ang)*f*dt);
        if(d<14){ p.hp-=25*dt; p.lastEnv='Yerçekimi anomalisi'; } }
    }
  }
  // zehir gölcükleri (T3+): içinde durursan DoT
  for(const hz of hazards){
    if(dist(hz.x,hz.y,p.x,p.y)<hz.r){ p.hp-=9*dt; p.lastEnv='Zehir gölcüğü'; hurtFlash=Math.max(hurtFlash,0.1); }
  }
  // alarm kulesi: hayattaysa periyodik takviye çağırır
  for(const pr of props){
    if(pr.dead||pr.type!=='alarm')continue;
    pr.cd-=dt;
    if(pr.cd<=0){
      pr.cd=22;
      addMsg('!! ALARM — takviye çağrıldı! Kuleyi yık (kırmızı ışık) !!'); sfxAt(pr.x,pr.y,SFX.alert);
      for(let i=0;i<2;i++){ const t=randReachTile(3,pr.x/TILE,pr.y/TILE); const s=mkSoldier((t.x+0.5)*TILE,(t.y+0.5)*TILE); s.state='invest'; s.tx=p.x; s.ty=p.y; enemies.push(s); }
    }
  }
  if(p.hp<=0&&state==='play'){
    p.hp=0; state='dying'; deathT=0.9; SFX.death();
    deathInfo={src:p.lastEnv||'Zone',hits:p.lastHits.slice()};
    recordLoss();
    save.raids++; persist(); return;
  }
  // geiger
  if(nearRad<1.7){
    geigerT-=dt;
    if(geigerT<=0){ SFX.geiger(); geigerT=clamp(nearRad*0.35,0.03,0.6)*R(0.6,1.4); }
  }
  // silah
  p.fireT-=dt; p.reloadT-=dt;
  if(p.reloadT<=0&&p.reloadT>-dt){ // reload bitti
    const take=Math.min(effMag(wk)-am.mag,am.res);
    if(take>0){am.mag+=take;am.res-=take;}
  }
  p.recRec-=dt;
  if(p.recRec<=0&&p.recIdx>0){ p.recIdx=Math.max(0,p.recIdx-1); p.recRec=0.06; }
  // --- mobil lazer nişan + otomatik ateş (yön joystick'i) ---
  if(touchAim.active){
    const ang=touchAim.ang; // lazer, nişan joystick'inin yönünü izler
    mouse.x=clamp(p.x-(cam.x-VW/2)+Math.cos(ang)*70,0,VW); // yüz/kamera/atış bu yöne bakar
    mouse.y=clamp(p.y-(cam.y-VH/2)+Math.sin(ang)*70,0,VH);
    // ışını duvara/menzile kadar yürüt
    let lx=p.x+Math.cos(ang)*10, ly=p.y+Math.sin(ang)*10, ldist=10;
    const maxD=w.melee?42:(w.range||200)*1.4+60;
    while(ldist<maxD&&!hitSolid(lx,ly,0.5)){ lx+=Math.cos(ang)*4; ly+=Math.sin(ang)*4; ldist+=4; }
    laserEnd.on=true; laserEnd.x=lx; laserEnd.y=ly;
    // hedef: ışın koridorundaki, görüş hattı açık en yakın düşman.
    // Yapışkan kilit (aim assist): mevcut hedef geniş koridorda kaldıkça bırakılmaz.
    const inRay=(e,corr)=>{
      const dp2=dist(e.x,e.y,p.x,p.y);
      if(e.dead||dp2>ldist+e.r||dp2>maxD)return false;
      const t2=clamp((e.x-p.x)*Math.cos(ang)+(e.y-p.y)*Math.sin(ang),0,ldist);
      return dist(e.x,e.y,p.x+Math.cos(ang)*t2,p.y+Math.sin(ang)*t2)<e.r+corr
             &&losClear(p.x,p.y,e.x,e.y);
    };
    if(!(aimLock&&!aimLock.dead&&inRay(aimLock,18))){
      aimLock=null; let best=1e9;
      for(const e of enemies){
        if(!inRay(e,6))continue;
        const dp2=dist(e.x,e.y,p.x,p.y);
        if(dp2<best){ best=dp2; aimLock=e; }
      }
    }
    const best=aimLock?dist(aimLock.x,aimLock.y,p.x,p.y):1e9;
    if(aimLock){
      // nişanı hedefe kilitle — atış tam hedefe gider (recoil kişiliği korunur)
      mouse.x=clamp(aimLock.x-(cam.x-VW/2),0,VW); mouse.y=clamp(aimLock.y-(cam.y-VH/2),0,VH);
      if(w.melee){ if(best<aimLock.r+16&&p.fireT<=0)meleeSwing(); }
      else if(w.charge){
        if(am.mag>0&&p.reloadT<=0){
          p.charge=clamp(p.charge+dt/1.2,0,1);
          if(p.charge>=1&&p.fireT<=0){ fireWeapon(1); p.charge=0; }
        }
      }
      else if(p.fireT<=0&&p.reloadT<=0)fireWeapon();
    } else if(w.charge&&!mouse.down)p.charge=Math.max(0,p.charge-dt*2);
  } else { laserEnd.on=false; if(!mouse.down&&isTouch)aimLock=null; }
  if(w.charge){
    if(mouse.down&&am.mag>0&&p.reloadT<=0)p.charge=clamp(p.charge+dt/1.2,0,1);
  } else if(mouse.down&&p.fireT<=0&&p.reloadT<=0){
    if(w.auto||!p.latch){ fireWeapon(); p.latch=true; }
  }
  if(!mouse.down)p.latch=false;
  const mwx=cam.x-VW/2+mouse.x, mwy=cam.y-VH/2+mouse.y;
  p.face=Math.atan2(mwy-p.y,mwx-p.x);
  // --- noise events yaşlandır ---
  for(let i=noiseEvents.length-1;i>=0;i--){ noiseEvents[i].t-=dt; if(noiseEvents[i].t<=0)noiseEvents.splice(i,1); }
  // --- enemies ---
  for(const e of enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    const dp=dist(e.x,e.y,p.x,p.y);
    // işitme (duvar arkasında ses yarıya kısılır)
    for(const ev of noiseEvents){
      let rr=ev.r;
      if(rr>30&&!losClear(e.x,e.y,ev.x,ev.y))rr*=0.5;
      if(dist(e.x,e.y,ev.x,ev.y)<rr){
        if(e.kind==='sol'||e.kind==='elite'){ if(e.state==='patrol'){e.state='invest';e.tx=ev.x;e.ty=ev.y;sfxAt(e.x,e.y,SFX.alert);} else if(e.state==='invest'){e.tx=ev.x;e.ty=ev.y;} }
        else { e.state='chase'; }
      }
    }
    if(e.kind==='boss')updateBoss(e,dp,dt);
    else if(e.kind==='col')updateCollector(e,dp,dt);
    else if(e.kind==='drone')updateDrone(e,dp,dt);
    else if(e.kind==='spit')updateSpitter(e,dp,dt);
    else if(e.kind==='sol'||e.kind==='elite')updateSoldier(e,dp,dt);
    else if(e.kind==='hound')updateHound(e,dp,dt);
    else updateSuicider(e,dp,dt);
  }
  enemies=enemies.filter(e=>!e.dead);
  // --- ayrışma: düşmanlar üst üste ve oyuncunun üstüne binmez ---
  for(let i=0;i<enemies.length;i++){
    const a=enemies[i];
    for(let j=i+1;j<enemies.length;j++){
      const b=enemies[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.hypot(dx,dy)||0.01, min=a.r+b.r;
      if(d<min){
        const push=(min-d)/2, ux=dx/d, uy=dy/d;
        if(!hitSolid(a.x-ux*push,a.y-uy*push,a.r)){ a.x-=ux*push; a.y-=uy*push; }
        if(!hitSolid(b.x+ux*push,b.y+uy*push,b.r)){ b.x+=ux*push; b.y+=uy*push; }
      }
    }
    const dx=a.x-p.x, dy=a.y-p.y;
    const d=Math.hypot(dx,dy)||0.01, min=a.r+p.r;
    if(d<min){
      const push=min-d, ux=dx/d, uy=dy/d;
      if(!hitSolid(a.x+ux*push,a.y+uy*push,a.r)){ a.x+=ux*push; a.y+=uy*push; }
    }
  }
  // --- bullets ---
  for(const b of bullets){
    if(b.hit)continue;
    b.life-=dt;
    if(b.life<=0){b.hit=true;continue;}
    // gravity well mermileri büker
    for(const a of anomalies)if(a.type==='grav'){
      const d=dist(a.x,a.y,b.x,b.y);
      if(d<a.r){ const f=(1-d/a.r)*900*dt; const ang=Math.atan2(a.y-b.y,a.x-b.x); b.vx+=Math.cos(ang)*f; b.vy+=Math.sin(ang)*f; }
    }
    const stepLen=Math.hypot(b.vx,b.vy)*dt, n=Math.max(1,Math.ceil(stepLen/4));
    for(let s=0;s<n&&!b.hit;s++){
      b.x+=b.vx*dt/n; b.y+=b.vy*dt/n;
      b.dist=(b.dist||0)+stepLen/n;
      if(solidPx(b.x,b.y)){ b.hit=true; sparks(b.x,b.y,3); break; }
      const pr=propAt(b.x,b.y,1);
      if(pr){
        if(pr.type==='locker'||pr.type==='terminal'||pr.type==='lamp'){
          sparks(b.x,b.y,3,'#9aa8c0');
          if(!b.pierce)b.hit=true;
          break;
        }
        pr.hp-=b.smash?100:b.dmg;
        sparks(b.x,b.y,3,'#caa');
        if(pr.hp<=0){
          pr.dead=true;
          if(pr.type==='barrel')explosion(pr.x,pr.y,52,55,0);
          else if(pr.type==='alarm'){ sparks(pr.x,pr.y,10,'#ff5a4a'); addMsg('ALARM KULESİ SUSTURULDU — takviye durdu'); gainXP(30); }
          else { // sandık loot
            if(rand()<0.7)pickups.push({x:pr.x,y:pr.y,type:rand()<0.6?'credit':'ammo',val:Math.round(RI(15,50)*SEC.loot),bob:0});
            sparks(pr.x,pr.y,8,'#b8965a');
          }
        }
        if(!b.pierce)b.hit=true;
        break;
      }
      if(b.from==='p'){
        for(const e of enemies){
          if(e.dead)continue;
          if(dist(b.x,b.y,e.x,e.y)<e.r+2){
            let dm=b.dmg;
            if(b.range&&b.dist>b.range)dm*=Math.max(0.55,1-(b.dist-b.range)/b.range*0.45); // menzil düşüşü
            if(rand()<0.10){ dm*=2.2; sparks(b.x,b.y,5,'#ffe08a'); sfxAt(b.x,b.y,()=>tone(1050,0.06,'square',0.1,320)); // kritik
              if(hasPerk('cerrah')){ dm*=1.4; blood(e.x,e.y,6); } } // Cerrah: kritikler kanatır
            hurtEnemy(e,dm,b.x,b.y);
            if(b.shock){ e.stun=(e.kind==='boss')?0.25:(e.kind==='drone')?3.5:1; sfxAt(e.x,e.y,SFX.stun); sparks(e.x,e.y,6,'#6ee7ff'); }
            hitstop=Math.max(hitstop,e.hp<=0?0.04:0.012);
            if(!b.pierce)b.hit=true;
            break;
          }
        }
      } else {
        if(p.inv<=0&&dist(b.x,b.y,p.x,p.y)<p.r+2){
          damagePlayer(b.dmg,{boss:'The Source mermisi',elite:'Elit mermisi',drone:'Drone',spit:'Asit tükürüğü'}[b.srcKind]||'Asker mermisi',
            p.x-b.vx,p.y-b.vy); // merminin geldiği yön
          b.hit=true;
        }
      }
    }
  }
  bullets=bullets.filter(b=>!b.hit);
  // --- props temizle ---
  props=props.filter(pr=>!pr.dead);
  // --- pickups ---
  for(const pk of pickups){
    if(pk.got)continue;
    pk.bob+=dt*3;
    if(dist(pk.x,pk.y,p.x,p.y)<13){
      pk.got=true;
      if(pk.type==='credit'){ p.credits+=pk.val; SFX.pickup(); }
      else if(pk.type==='med'){ p.hp=clamp(p.hp+35,0,p.maxhp); SFX.pickup(); addMsg('+35 HP (medkit)'); }
      else if(pk.type==='ammo'){
        for(const k of p.weapons)p.ammo[k].res+=Math.ceil(WEAPONS[k].mag*0.8);
        SFX.pickup(); addMsg('Mühimmat ikmali');
      }
      else if(pk.type==='keycard'){
        p.keycards++; SFX.pickup();
        addMsg('ANAHTAR KART alındı ('+p.keycards+')');
      }
      else if(pk.type==='perk'){
        if(p.perks.length<3&&!p.perks.includes(pk.perk)){
          p.perks.push(pk.perk); SFX.artifact();
          addMsg('NÖRAL ÇİP: '+PERKS[pk.perk].name+' — '+PERKS[pk.perk].desc);
        } else { p.credits+=120; SFX.pickup(); addMsg(PERKS[pk.perk].name+' satıldı (+120 kr) — çip yuvası dolu'); }
      }
      else if(pk.type==='mod'){
        const wkC=p.weapons[p.wi];
        if(!p.attach[wkC])p.attach[wkC]=[];
        const L=p.attach[wkC];
        if(L.length<2&&!L.includes(pk.mod)){
          L.push(pk.mod); SFX.artifact();
          addMsg(ATTACH[pk.mod].name+' takıldı → '+WEAPONS[wkC].name);
        } else {
          p.credits+=150; SFX.pickup();
          addMsg(ATTACH[pk.mod].name+' satıldı (+150 kr) — '+WEAPONS[wkC].name+' slotu dolu');
        }
      }
      else if(pk.type==='artifact'){
        p.credits+=pk.val; p.artifacts++; gainXP(30); SFX.artifact();
        objProgress('artifact',1);
        addMsg('ARTEFAKT ALINDI (+'+pk.val+' kredi)');
        if(!huntersSent){
          huntersSent=true;
          addMsg('!! ZONE SENİ DUYDU — AVCI TİMİ EXTRACTION\'A YÖNELİYOR !!');
          for(let i=0;i<4;i++){
            let t=null;
            for(let tr=0;tr<200;tr++){
              const c=reachList[RI(0,reachList.length-1)];
              const cx=c%MW, cy=(c/MW)|0;
              if(dist(cx,cy,extract.x/TILE,extract.y/TILE)<10){ t={x:cx,y:cy}; break; }
            }
            if(!t)t=randReachTile(20,p.x/TILE,p.y/TILE);
            const s=mkSoldier((t.x+0.5)*TILE,(t.y+0.5)*TILE);
            s.state='invest'; s.tx=extract.x; s.ty=extract.y; s.spd=64;
            enemies.push(s);
          }
        }
      }
    }
  }
  pickups=pickups.filter(pk=>!pk.got);
  // --- etkileşim taraması + ceset lore ---
  nearInteract=null;
  for(const pr of props){
    if(pr.dead)continue;
    if((pr.type==='terminal'&&!pr.used)||pr.type==='locker'){
      if(!nearInteract&&dist(pr.x,pr.y,p.x,p.y)<18)nearInteract=pr;
    } else if(pr.type==='corpse'&&!pr.read&&dist(pr.x,pr.y,p.x,p.y)<20){
      pr.read=true; addMsg('» '+pr.lore); recordLore(pr.lore);
    }
  }
  // --- düşük HP kalp atışı ---
  if(p.hp<p.maxhp*0.3){
    lowBeatT-=dt;
    if(lowBeatT<=0){ SFX.heartbeat(); lowBeatT=lerp(0.45,0.95,p.hp/(p.maxhp*0.3)); }
  }
  // --- dinamik olay ---
  if(raidEvent&&!raidEvent.done){
    raidEvent.t-=dt;
    if(!raidEvent.warned&&raidEvent.t<=8){
      raidEvent.warned=true; SFX.alert();
      addMsg('!! TELSİZ: '+(raidEvent.type==='storm'?'Anomali fırtınası geliyor — sabit durma!'
        :raidEvent.type==='blackout'?'Şebeke çöküyor — ışıklar gidecek!'
        :'Kimliksiz tim bölgeye giriyor!'));
    }
    if(raidEvent.t<=0){ raidEvent.done=true; fireEvent(raidEvent.type); }
  }
  // --- adaptif müzik: tehlike algısı ---
  let danger=false, bossNear=false;
  for(const e of enemies){
    if(e.dead)continue;
    if(e.kind==='boss'&&e.aware){ danger=true; bossNear=true; break; }
    if((e.state==='combat'||e.state==='chase')&&dist(e.x,e.y,p.x,p.y)<340){ danger=true; }
  }
  musicUpdate(dt,danger,bossNear);
  // --- extraction ---
  const inExt=dist(p.x,p.y,extract.x,extract.y)<extract.r;
  if(inExt){
    extract.t+=dt;
    extract.beatT-=dt;
    if(extract.beatT<=0){ SFX.heartbeat(); extract.beatT=lerp(0.8,0.35,extract.t/10); }
    if(extract.t>=10){
      gainXP((100+SEC.danger*20)*(raidMod&&raidMod.k==='kizilay'?2:1)); // canlı çıkmak en büyük ders
      commitMastery(); // silah ustalığı kalıcılaşır
      state='extracted';
      save.credits+=p.credits; save.extracts++; save.raids++;
      save.bestRaid=Math.max(save.bestRaid,p.credits);
      save.stash.med+=p.meds; // kullanılmayan medkitler kasaya döner
      if(!dailyMode)save.attach=p.attach; // eklentiler çıkarınca kalıcı; günlük mod kalıcı envanteri ezmez
      if(dailyMode){
        const key=todayKey();
        if(save.daily.date!==key)save.daily={date:key,best:p.credits};
        else save.daily.best=Math.max(save.daily.best,p.credits);
      } else if(save.sector===save.maxSector&&save.maxSector<SECTORS.length-1){
        save.maxSector++; newUnlock=SECTORS[save.maxSector];
      }
      // hikâye ilerlemesi: mevcut adım bu bölgeyse ilerle
      if(!dailyMode){
        const st=storyStep();
        if(st&&st.sec===save.sector&&save.story<STORY.length-1){ save.story++; storyAdvanced=STORY[save.story]; }
      }
      if(!dailyMode)save.tutorialDone=true; // ilk extraction öğreticiyi bitirir
      markAch('firstextract');
      if(p.noFire)markAch('ghost');
      for(const wk in save.mastery)if(save.mastery[wk].lvl>=5)markAch('master');
      if(save.credits>=5000)markAch('rich');
      if(bossKilledThisRaid){ save.ngplus=(save.ngplus||0)+1; endingShown=true; }
      persist(); SFX.extractOk();
    }
  } else if(extract.t>0)extract.t=Math.max(0,extract.t-dt*2);
  // --- particles / msgs / lights ---
  for(const pt of parts){
    pt.life-=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.vx-=pt.vx*pt.fric*dt; pt.vy-=pt.vy*pt.fric*dt;
  }
  parts=parts.filter(pt=>pt.life>0);
  for(const m of msgs)m.t-=dt;
  msgs=msgs.filter(m=>m.t>0);
  for(const dd of dmgDirs)dd.t-=dt;
  dmgDirs=dmgDirs.filter(dd=>dd.t>0);
  for(const fd of floatDmg){ fd.t-=dt; fd.y-=18*dt; }
  floatDmg=floatDmg.filter(fd=>fd.t>0);
  // rehberli ilk raid — zamanlı sıra
  if(tutStep>=0&&tutStep<TUT.length){
    tutTimer-=dt;
    if(tutTimer<=0){ addMsg('◈ '+TUT[tutStep]); tutStep++; tutTimer=tutStep<3?4:5.5; }
  }
  for(const li of lights)li.t-=dt;
  lights=lights.filter(li=>li.t>0);
  // --- camera ---
  const camW=mouse.rdown?0.55:0.35; // ADS: kamera imlece uzanır
  const tx=p.x+(mouse.x-VW/2)*camW, ty=p.y+(mouse.y-VH/2)*camW;
  cam.x=lerp(cam.x,tx,clamp(8*dt,0,1));
  cam.y=lerp(cam.y,ty,clamp(8*dt,0,1));
  cam.x=clamp(cam.x,VW/2,MW*TILE-VW/2);
  cam.y=clamp(cam.y,VH/2,MH*TILE-VH/2);
  shake=Math.max(0,shake-30*dt);
  camKick.x=lerp(camKick.x,0,clamp(14*dt,0,1));
  camKick.y=lerp(camKick.y,0,clamp(14*dt,0,1));
  hurtFlash=Math.max(0,hurtFlash-dt);
}
// Ölüm slow-mo: dünya çeyrek hızda akar, ekran kararır, sonra K.I.A.
function updateDying(dt){
  deathT-=dt;
  const s=0.25;
  for(const pt of parts){ pt.life-=dt*s; pt.x+=pt.vx*dt*s; pt.y+=pt.vy*dt*s; }
  parts=parts.filter(pt=>pt.life>0);
  for(const b of bullets){ b.x+=b.vx*dt*s; b.y+=b.vy*dt*s; b.life-=dt*s; }
  bullets=bullets.filter(b=>b.life>0&&!b.hit);
  for(const li of lights)li.t-=dt*s;
  lights=lights.filter(li=>li.t>0);
  shake=Math.max(0,shake-30*dt);
  camKick.x=lerp(camKick.x,0,clamp(14*dt,0,1));
  camKick.y=lerp(camKick.y,0,clamp(14*dt,0,1));
  if(deathT<=0)state='dead';
}

function updateSoldier(e,dp,dt){
  const p=player;
  // görüş: koni + LOS
  const angTo=Math.atan2(p.y-e.y,p.x-e.x);
  const seeRange=(e.state==='combat'?230:170)*(raidMod&&raidMod.k==='sis'?0.6:1);
  const canSee=p.stealthT<=0&&dp<seeRange&&Math.abs(angDiff(e.face,angTo))<1.15&&losClear(e.x,e.y,p.x,p.y);
  if(canSee){
    e.seeT+=dt*(1.6-clamp(dp/seeRange,0,1));
    if(e.seeT>0.4&&e.state!=='combat'&&e.state!=='retreat'){ e.state='combat'; sfxAt(e.x,e.y,SFX.alert); }
    if(e.state==='combat'){ e.lastX=p.x; e.lastY=p.y; e.lostT=0; }
  } else { e.seeT=Math.max(0,e.seeT-dt); if(e.state==='combat')e.lostT+=dt; }
  if(e.state==='combat'&&e.lostT>4){ e.state='invest'; e.tx=e.lastX; e.ty=e.lastY; }
  // ağır yaralı asker geri çekilir ve telsizle destek çağırır (bir kez)
  if(e.kind==='sol'&&!e.fled&&e.state==='combat'&&e.hp<e.maxhp*0.3){
    e.fled=true; e.state='retreat'; e.retT=2.2; sfxAt(e.x,e.y,SFX.alert);
    let best=null,bd=1e9;
    for(const o of enemies){
      if(o!==e&&!o.dead&&o.kind==='sol'&&o.state==='patrol'){
        const d=dist(e.x,e.y,o.x,o.y);
        if(d<bd){bd=d;best=o;}
      }
    }
    if(best){ best.state='invest'; best.tx=p.x; best.ty=p.y; }
  }

  if(e.state==='retreat'){
    e.retT-=dt;
    seekTo(e,e.x*2-p.x,e.y*2-p.y,e.spd*1.15,dt);
    e.face=Math.atan2(p.y-e.y,p.x-e.x);
    if(e.retT<=0)e.state='combat';
  }
  else if(e.state==='patrol'){
    e.wanderT-=dt;
    if(e.wanderT<=0){ e.wanderT=R(2,5); const t=randReachTile(0,e.x/TILE,e.y/TILE);
      const nx=e.x+R(-70,70),ny=e.y+R(-70,70);
      e.tx=hitSolid(nx,ny,e.r)?(t.x+0.5)*TILE:nx; e.ty=hitSolid(nx,ny,e.r)?(t.y+0.5)*TILE:ny; }
    seekTo(e,e.tx,e.ty,e.spd*0.55,dt);
  }
  else if(e.state==='invest'){
    seekTo(e,e.tx,e.ty,e.spd*0.85,dt);
    if(dist(e.x,e.y,e.tx,e.ty)<14)e.state='patrol';
  }
  else if(e.state==='combat'){
    // mesafe koru + ateş
    const ideal=(e.kind==='elite'?110:140)/(e.agg||1); // kişilik: agresifler yaklaşır
    if(dp>ideal+30)seekTo(e,e.lastX,e.lastY,e.spd,dt);
    else if(dp<ideal-40)seekTo(e,e.x*2-p.x,e.y*2-p.y,e.spd*0.8,dt);
    else { // strafe
      const perp=angTo+Math.PI/2*(e.strafe||((e.strafe=rand()<0.5?1:-1),e.strafe));
      seekTo(e,e.x+Math.cos(perp)*30,e.y+Math.sin(perp)*30,e.spd*0.6,dt);
    }
    e.face=angTo;
    e.cd-=dt;
    if(e.cd<=0&&canSee){
      e.aimT+=dt;
      if(e.aimT>0.45){
        e.burst=e.kind==='elite'?4:3; e.burstT=0; e.aimT=0;
        e.cd=e.kind==='elite'?R(1.6,2.4):R(1.1,2.0);
      }
    } else e.aimT=Math.max(0,e.aimT-dt);
    if(e.burst>0){
      e.burstT-=dt;
      if(e.burstT<=0){
        e.burstT=0.11; e.burst--;
        enemyFire(e,p.x,p.y,0.13,e.kind==='elite'?13:8,e.kind==='elite'?300:260);
        noiseEvent(e.x,e.y,200);
      }
    }
  }
  if(e.state!=='combat'){
    const mvAng=Math.atan2(e.ty-e.y,e.tx-e.x);
    e.face+=angDiff(e.face,mvAng)*clamp(4*dt,0,1);
  }
}
function updateHound(e,dp,dt){
  const p=player;
  if(e.state==='wander'){
    e.wanderT-=dt;
    if(e.wanderT<=0){ e.wanderT=R(1.5,4); e.tx=e.x+R(-80,80); e.ty=e.y+R(-80,80); }
    seekTo(e,e.tx,e.ty,e.spd*0.35,dt);
    if(dp<110&&p.stealthT<=0&&losClear(e.x,e.y,p.x,p.y))e.state='chase';
  } else {
    if(!e.growled){ e.growled=true; sfxAt(e.x,e.y,SFX.alert); }
    e.lungeCD-=dt;
    const stopR=e.r+p.r+3;
    if(dp>stopR)seekTo(e,p.x,p.y,e.spd,dt);
    else e.walk=(e.walk||0)+dt*6; // menzilde: yerinde diş gösterir, üstüne binmez
    e.face=Math.atan2(p.y-e.y,p.x-e.x);
    if(dp<stopR+3&&e.lungeCD<=0&&p.inv<=0){
      e.lungeCD=0.8; damagePlayer(11,'Mutant ısırığı',e.x,e.y);
      // ısırık görsel geri bildirimi
      const a=e.face;
      for(let i=0;i<4;i++)parts.push({x:p.x,y:p.y,vx:Math.cos(a+R(-0.5,0.5))*60,vy:Math.sin(a+R(-0.5,0.5))*60,
        life:0.25,max:0.25,col:'#ff5a2a',size:1.5,fric:6});
    }
    if(dp>320)e.state='wander';
  }
}
function updateSuicider(e,dp,dt){
  const p=player;
  if(e.state==='wander'){
    e.wanderT-=dt;
    if(e.wanderT<=0){ e.wanderT=R(2,4); e.tx=e.x+R(-60,60); e.ty=e.y+R(-60,60); }
    seekTo(e,e.tx,e.ty,e.spd*0.3,dt);
    if(dp<130&&p.stealthT<=0&&losClear(e.x,e.y,p.x,p.y))e.state='chase';
  } else {
    if(!e.screamed){ e.screamed=true; sfxAt(e.x,e.y,SFX.scream); addMsg('!! ÇIĞLIK — canlı bomba yaklaşıyor !!'); }
    seekTo(e,p.x,p.y,e.spd,dt);
    e.face=Math.atan2(p.y-e.y,p.x-e.x);
    if(dp<16){ e.hp=0; killEnemy(e); }
  }
}
// ---------- THE SOURCE — FİNAL BOSS (GDD Bölüm 2 §7.2) ----------
function bossRadial(e,n,speed){
  for(let i=0;i<n;i++){
    const a=e.spiral+i/n*TAU;
    bullets.push({x:e.x+Math.cos(a)*13,y:e.y+Math.sin(a)*13,
      vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,dmg:12,from:'e',life:2.6,col:'#c47aff',srcKind:'boss'});
  }
  e.spiral+=0.45;
  sfxAt(e.x,e.y,SFX.plasma); addLight(e.x,e.y,64,0.16,'196,122,255');
}
function updateBoss(e,dp,dt){
  const p=player;
  if(!e.aware){
    if(dp<250||e.hp<e.maxhp){
      e.aware=true; sfxAt(e.x,e.y,SFX.scream); shake=Math.min(shake+8,14);
      addMsg('!! THE SOURCE UYANDI — gerçeklik titriyor !!');
    } else return;
  }
  e.face=Math.atan2(p.y-e.y,p.x-e.x);
  e.phase=e.hp>e.maxhp*0.66?1:e.hp>e.maxhp*0.33?2:3;
  // faz 2+: psionik çekim
  if(e.phase>=2&&dp<170&&dp>4){
    const f=26*(1-dp/170);
    moveCirc(p,(e.x-p.x)/dp*f*dt,(e.y-p.y)/dp*f*dt);
  }
  // faz 2+: minyon çağırma
  if(e.phase>=2){
    e.minT-=dt;
    if(e.minT<=0){
      e.minT=9;
      let hc=0; for(const o of enemies)if(o.kind==='hound'&&!o.dead)hc++;
      if(hc<6){
        for(let i=0;i<2;i++){
          const h=mkHound(e.x+R(-30,30),e.y+R(-30,30));
          h.state='chase'; h.growled=true;
          enemies.push(h);
        }
        SFX.alert(); addMsg('The Source çağırıyor — mutantlar geliyor!');
      }
    }
  }
  // faz 3: telegraflı şarj saldırısı
  if(e.dashT>0){
    e.dashT-=dt;
    moveCirc(e,Math.cos(e.dashA)*300*dt,Math.sin(e.dashA)*300*dt);
    if(dist(e.x,e.y,p.x,p.y)<e.r+p.r+4&&p.inv<=0){ damagePlayer(24,'The Source şarjı',e.x,e.y); p.inv=0.5; }
    return;
  }
  if(e.telT>0){ e.telT-=dt; if(e.telT<=0){ e.dashT=0.5; e.dashA=e.face; sfxAt(e.x,e.y,SFX.scream); } return; }
  seekTo(e,p.x,p.y,e.phase===3?40:26,dt);
  e.atkT-=dt;
  if(e.atkT<=0){
    if(e.phase===1){ bossRadial(e,14,170); e.atkT=2.4; }
    else if(e.phase===2){
      bossRadial(e,18,185); e.atkT=2.0;
      for(let i=0;i<3;i++)enemyFire(e,p.x,p.y,0.14,13,260); // nişanlı üçlü
    }
    else {
      bossRadial(e,22,205); e.atkT=1.7;
      if(rand()<0.5&&dp<220)e.telT=0.6; // dash telegrafı
    }
  }
}
// The Collector: kaybettiğin ganimeti taşır — saldırmaz, KAÇAR; avla ve geri al
function updateDrone(e,dp,dt){
  const p=player;
  e.phase+=dt*3;
  const canSee=p.stealthT<=0&&dp<260&&losClear(e.x,e.y,p.x,p.y);
  if(canSee){ e.state='combat'; e.lastX=p.x; e.lastY=p.y; }
  else if(e.state==='combat'&&dp>340)e.state='patrol';
  e.face=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.state==='patrol'){
    e.wanderT-=dt;
    if(e.wanderT<=0){ e.wanderT=R(2,4); const t=randReachTile(0,e.x/TILE,e.y/TILE); e.tx=(t.x+0.5)*TILE; e.ty=(t.y+0.5)*TILE; }
    seekTo(e,e.tx,e.ty,40,dt);
  } else {
    // ideal mesafede sinüs süzülme
    const ideal=150, perp=e.face+Math.PI/2;
    const tx=p.x-Math.cos(e.face)*ideal+Math.cos(perp)*Math.sin(e.phase)*40;
    const ty=p.y-Math.sin(e.face)*ideal+Math.sin(perp)*Math.sin(e.phase)*40;
    seekTo(e,tx,ty,72,dt);
    e.cd-=dt;
    if(e.cd<=0&&canSee){ e.cd=R(1.1,1.8); enemyFire(e,p.x,p.y,0.08,9,320); }
  }
}
function updateSpitter(e,dp,dt){
  const p=player;
  if(e.state==='wander'){
    e.wanderT-=dt;
    if(e.wanderT<=0){ e.wanderT=R(2,4); e.tx=e.x+R(-60,60); e.ty=e.y+R(-60,60); }
    seekTo(e,e.tx,e.ty,e.spd*0.4,dt);
    if(dp<220&&p.stealthT<=0&&losClear(e.x,e.y,p.x,p.y)){ e.state='chase'; if(!e.screamed){e.screamed=true;sfxAt(e.x,e.y,SFX.scream);} }
  } else {
    // orta mesafe koru, asit tükür
    if(dp<120)seekTo(e,e.x*2-p.x,e.y*2-p.y,e.spd,dt);
    else if(dp>200)seekTo(e,p.x,p.y,e.spd,dt);
    e.face=Math.atan2(p.y-e.y,p.x-e.x);
    e.cd-=dt;
    if(e.cd<=0&&losClear(e.x,e.y,p.x,p.y)){
      e.cd=R(1.6,2.4);
      const ang=e.face+R(-0.1,0.1);
      bullets.push({x:e.x+Math.cos(ang)*8,y:e.y+Math.sin(ang)*8,vx:Math.cos(ang)*180,vy:Math.sin(ang)*180,
        dmg:10,from:'e',life:1.6,col:'#8aff5a',srcKind:'spit',acid:true});
      sfxAt(e.x,e.y,()=>noiseSfx(0.12,0.2,700,1.5));
    }
    if(dp>360)e.state='wander';
  }
}
function updateCollector(e,dp,dt){
  const p=player;
  if(dp<170&&p.stealthT<=0&&losClear(e.x,e.y,p.x,p.y)){
    if(!e.spotted){ e.spotted=true; sfxAt(e.x,e.y,SFX.alert); addMsg('!! THE COLLECTOR seni gördü — kaçıyor! Ganimetini kaçırma !!'); }
    seekTo(e,e.x*2-p.x,e.y*2-p.y,78,dt);
    e.face=Math.atan2(e.y-p.y,e.x-p.x);
  } else {
    e.wanderT-=dt;
    if(e.wanderT<=0){
      e.wanderT=R(2,4);
      const nx=e.x+R(-90,90), ny=e.y+R(-90,90);
      if(hitSolid(nx,ny,e.r)){ const t=randReachTile(0,e.x/TILE,e.y/TILE); e.tx=(t.x+0.5)*TILE; e.ty=(t.y+0.5)*TILE; }
      else { e.tx=nx; e.ty=ny; }
    }
    seekTo(e,e.tx,e.ty,e.spd*0.6,dt);
    e.face=Math.atan2(e.ty-e.y,e.tx-e.x);
  }
}
function seekTo(e,tx,ty,spd,dt){
  const ang=Math.atan2(ty-e.y,tx-e.x);
  const ox=e.x,oy=e.y;
  e.walk=(e.walk||0)+dt*spd*0.14;
  moveCirc(e,Math.cos(ang)*spd*dt,Math.sin(ang)*spd*dt);
  // sıkıştıysa yan kay
  if(Math.abs(e.x-ox)<0.1&&Math.abs(e.y-oy)<0.1){
    const perp=ang+(e.slidDir||((e.slidDir=rand()<0.5?1:-1),e.slidDir))*Math.PI/2;
    moveCirc(e,Math.cos(perp)*spd*dt,Math.sin(perp)*spd*dt);
  } else if(rand()<0.01)e.slidDir=0;
}

// ---------- DRAW ----------
function draw(){
  ctx.fillStyle='#07080f'; ctx.fillRect(0,0,VW,VH);
  if(state==='menu'){ drawMenu(); present(); return; }
  if(state==='opselect'){ drawOpSelect(); present(); return; }
  if(state==='secselect'){ drawSecSelect(); present(); return; }
  if(state==='market'){ drawMarket(); present(); return; }
  if(state==='hideout'){ drawHideout(); present(); return; }
  if(state==='settings'){ drawSettings(); present(); return; }
  if(state==='codex'){ drawCodex(); present(); return; }
  if(state==='journal'){ drawJournal(); present(); return; }
  const shk=shake*save.settings.shake;
  const sx=Math.round(cam.x-VW/2+camKick.x+(shk>0?R(-shk,shk):0));
  const sy=Math.round(cam.y-VH/2+camKick.y+(shk>0?R(-shk,shk):0));
  const w2s=(x,y)=>[Math.round(x-sx),Math.round(y-sy)];
  // --- tiles ---
  const tx0=clamp(Math.floor(sx/TILE),0,MW-1), ty0=clamp(Math.floor(sy/TILE),0,MH-1);
  const tx1=clamp(Math.ceil((sx+VW)/TILE),0,MW), ty1=clamp(Math.ceil((sy+VH)/TILE),0,MH);
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    const px=tx*TILE-sx, py=ty*TILE-sy;
    const h=(tx*73856093^ty*19349663)>>>0;
    if(map[ty*MW+tx]===1){
      ctx.fillStyle=SEC.wall; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle=SEC.wallHi; ctx.fillRect(px,py,TILE,3);
      ctx.fillStyle=SEC.wallLo; ctx.fillRect(px,py+TILE-2,TILE,2);
    } else {
      ctx.fillStyle=(h%7===0)?SEC.floors[0]:(h%5===0)?SEC.floors[1]:SEC.floors[2];
      ctx.fillRect(px,py,TILE,TILE);
      if(h%23===0){ ctx.fillStyle=SEC.wallLo; ctx.fillRect(px+(h%9),py+(h%11),2,2); }
    }
  }
  // decals
  for(const d of decals){
    const [dxp,dyp]=w2s(d.x,d.y);
    if(dxp<-20||dyp<-20||dxp>VW+20||dyp>VH+20)continue;
    ctx.fillStyle=d.col; ctx.beginPath(); ctx.arc(dxp,dyp,d.r,0,TAU); ctx.fill();
  }
  // anomalies
  for(const a of anomalies){
    const [ax,ay]=w2s(a.x,a.y);
    if(ax<-120||ay<-120||ax>VW+120||ay>VH+120)continue;
    a.ph+=0.02;
    if(a.type==='rad'){
      ctx.strokeStyle='rgba(90,230,120,0.16)';
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.arc(ax,ay,a.r*(0.5+0.25*i)+Math.sin(a.ph*2+i)*4,0,TAU); ctx.stroke();
      }
      ctx.fillStyle='rgba(90,230,120,0.05)';
      ctx.beginPath(); ctx.arc(ax,ay,a.r,0,TAU); ctx.fill();
    } else {
      ctx.strokeStyle='rgba(190,110,255,0.28)';
      for(let i=0;i<4;i++){
        const an=a.ph*1.5+i*TAU/4;
        ctx.beginPath(); ctx.arc(ax,ay,a.r*0.65,an,an+1.1); ctx.stroke();
      }
      ctx.fillStyle='rgba(150,70,230,0.09)';
      ctx.beginPath(); ctx.arc(ax,ay,a.r,0,TAU); ctx.fill();
      ctx.fillStyle='#c47aff'; ctx.fillRect(ax-1,ay-1,3,3);
    }
  }
  // zehir gölcükleri
  for(const hz of hazards){
    const [hx,hy]=w2s(hz.x,hz.y);
    if(hx<-60||hy<-60||hx>VW+60||hy>VH+60)continue;
    hz.ph+=0.03;
    ctx.fillStyle='rgba(120,200,60,0.16)'; ctx.beginPath(); ctx.arc(hx,hy,hz.r,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(150,255,90,0.12)'; ctx.beginPath(); ctx.arc(hx,hy,hz.r*(0.5+0.15*Math.sin(hz.ph)),0,TAU); ctx.fill();
    ctx.fillStyle='rgba(180,255,120,0.5)';
    for(let i=0;i<3;i++){ const a=hz.ph+i*2.1; ctx.fillRect(hx+Math.cos(a)*hz.r*0.6-1,hy+Math.sin(a)*hz.r*0.6-1,2,2); }
  }
  // extraction
  {
    const [ex,ey]=w2s(extract.x,extract.y);
    const pulse=1+Math.sin(raidT*4)*0.08;
    ctx.strokeStyle='rgba(90,255,150,0.75)';
    ctx.beginPath(); ctx.arc(ex,ey,extract.r*pulse,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(90,255,150,0.25)';
    ctx.beginPath(); ctx.arc(ex,ey,extract.r*0.6,raidT*2,raidT*2+4); ctx.stroke();
    ctx.fillStyle='rgba(90,255,150,0.9)';
    ctx.fillRect(ex-1,ey-14,2,10);
    ctx.fillStyle='#5aff96'; ctx.font='7px monospace'; ctx.textAlign='center';
    ctx.fillText('EXFIL',ex,ey+24);
  }
  // pickups
  for(const pk of pickups){
    const [px,py]=w2s(pk.x,pk.y+Math.sin(pk.bob)*1.5);
    if(px<-20||py<-20||px>VW+20||py>VH+20)continue;
    if(pk.type==='credit'){ ctx.fillStyle='#ffd24a'; ctx.fillRect(px-2,py-2,4,4); ctx.fillStyle='#a8842a'; ctx.fillRect(px-2,py+1,4,1); }
    else if(pk.type==='med'){ ctx.fillStyle='#e8e8ee'; ctx.fillRect(px-4,py-3,8,6); ctx.fillStyle='#ff4a4a'; ctx.fillRect(px-1,py-2,2,4); ctx.fillRect(px-3,py-1,6,2); }
    else if(pk.type==='ammo'){ ctx.fillStyle='#7a8a5a'; ctx.fillRect(px-4,py-3,8,6); ctx.fillStyle='#ffd27a'; ctx.fillRect(px-2,py-1,1,2); ctx.fillRect(px,py-1,1,2); ctx.fillRect(px+2,py-1,1,2); }
    else if(pk.type==='mod'){
      const mc=ATTACH[pk.mod].col;
      ctx.fillStyle='#1c2130'; ctx.fillRect(px-4,py-4,8,8);
      ctx.strokeStyle=mc; ctx.strokeRect(px-4.5,py-4.5,9,9);
      ctx.fillStyle=mc; ctx.fillRect(px-2,py-2,4,4);
    }
    else if(pk.type==='perk'){
      const pc=PERKS[pk.perk].col, g=1+Math.sin(pk.bob*2)*0.25;
      ctx.fillStyle='#0e1420'; ctx.beginPath(); ctx.arc(px,py,4*g,0,TAU); ctx.fill();
      ctx.strokeStyle=pc; ctx.beginPath(); ctx.arc(px,py,4*g,0,TAU); ctx.stroke();
      ctx.fillStyle=pc; ctx.fillRect(px-1,py-1,2,2);
      ctx.strokeStyle='rgba('+parseInt(pc.slice(1,3),16)+','+parseInt(pc.slice(3,5),16)+','+parseInt(pc.slice(5,7),16)+',0.4)';
      ctx.beginPath(); ctx.arc(px,py,7*g,0,TAU); ctx.stroke();
    }
    else { // artifact
      const g=1+Math.sin(pk.bob*2)*0.3;
      ctx.fillStyle='#c47aff'; ctx.beginPath(); ctx.arc(px,py,3*g,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(196,122,255,0.4)'; ctx.beginPath(); ctx.arc(px,py,6*g,0,TAU); ctx.stroke();
    }
  }
  // props
  for(const pr of props){
    const [px,py]=w2s(pr.x,pr.y);
    if(px<-20||py<-20||px>VW+20||py>VH+20)continue;
    if(pr.type==='crate'){
      ctx.fillStyle='#4a3d28'; ctx.fillRect(px-6,py-6,12,12);
      ctx.fillStyle='#5f4f34'; ctx.fillRect(px-6,py-6,12,3);
      ctx.strokeStyle='#2c2418'; ctx.strokeRect(px-6.5,py-6.5,13,13);
    } else if(pr.type==='barrel'){
      ctx.fillStyle='#7a2a20'; ctx.beginPath(); ctx.arc(px,py,6,0,TAU); ctx.fill();
      ctx.fillStyle='#a03a28'; ctx.fillRect(px-6,py-2,12,2);
      ctx.fillStyle='#ffd24a'; ctx.fillRect(px-1,py-4,3,3);
    } else if(pr.type==='terminal'){
      ctx.fillStyle='#1c2130'; ctx.fillRect(px-6,py-7,12,13);
      ctx.strokeStyle='#3a4360'; ctx.strokeRect(px-6.5,py-7.5,13,14);
      const on=!pr.used&&Math.sin(raidT*6+pr.x)>-0.6;
      ctx.fillStyle=pr.used?'#2a2f3e':(on?'#6ee7ff':'#2a6a7a');
      ctx.fillRect(px-4,py-5,8,5);
      ctx.fillStyle='#12151f'; ctx.fillRect(px-4,py+1,8,3);
    } else if(pr.type==='locker'){
      ctx.fillStyle='#3a4252'; ctx.fillRect(px-6,py-8,12,15);
      ctx.fillStyle='#4d5872'; ctx.fillRect(px-6,py-8,12,3);
      ctx.strokeStyle='#20242f'; ctx.strokeRect(px-6.5,py-8.5,13,16);
      ctx.fillStyle='#ffd24a'; ctx.fillRect(px-2,py-2,4,4);
      ctx.fillStyle='#12151f'; ctx.fillRect(px-1,py-1,2,2);
    } else if(pr.type==='lamp'){
      ctx.fillStyle='#20242f'; ctx.fillRect(px-1,py-9,2,10);
      const fl=pr.off?0.08:0.6+0.4*Math.sin(raidT*7+pr.ph);
      ctx.fillStyle='rgba(255,200,120,'+fl+')';
      ctx.fillRect(px-3,py-11,6,3);
    } else if(pr.type==='corpse'){
      ctx.fillStyle='rgba(120,10,25,0.35)';
      ctx.beginPath(); ctx.ellipse(px,py+2,9,5,0,0,TAU); ctx.fill();
      ctx.fillStyle='#3a3430'; ctx.fillRect(px-5,py-2,10,4);
      ctx.fillStyle='#57504a'; ctx.beginPath(); ctx.arc(px+6,py-1,2.4,0,TAU); ctx.fill();
      ctx.fillStyle='#2c2824'; ctx.fillRect(px-8,py-1,3,2);
    } else if(pr.type==='alarm'){
      ctx.fillStyle='#2a3040'; ctx.fillRect(px-4,py-4,8,12);
      ctx.fillStyle='#3a4458'; ctx.fillRect(px-5,py-9,10,5);
      const on=Math.sin(raidT*8+pr.ph)>0;
      ctx.fillStyle=on?'#ff3a2a':'#5a1a14';
      ctx.fillRect(px-3,py-8,6,3);
      if(on){ const g=ctx.createRadialGradient(px,py-7,0,px,py-7,14); g.addColorStop(0,'rgba(255,50,40,0.3)'); g.addColorStop(1,'rgba(255,50,40,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py-7,14,0,TAU); ctx.fill(); }
      if(pr.hp<60){ ctx.fillStyle='#222'; ctx.fillRect(px-8,py-14,16,2); ctx.fillStyle='#ff4a4a'; ctx.fillRect(px-8,py-14,16*(pr.hp/60),2); }
    }
  }
  // enemies
  for(const e of enemies){
    const [ex,ey]=w2s(e.x,e.y);
    if(ex<-30||ey<-30||ex>VW+30||ey>VH+30)continue;
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(ex,ey+e.r*0.8,e.r,e.r*0.5,0,0,TAU); ctx.fill();
    const flash=e.flash>0;
    if(e.kind==='boss'){ drawBoss(ex,ey,e); }
    else if(e.kind==='col'){
      drawHumanoid(ex,ey,e.r,e.face,{body:flash?'#e8e8e8':'#2c2420',hi:flash?'#fff':'#4a3c2a',
        head:'#1c1814',visor:'#ffd24a',walk:e.walk||0,gun:false,pack:'#8a6a2a'});
      // altın çuval parıltısı
      ctx.fillStyle='rgba(255,210,74,'+(0.5+0.3*Math.sin(raidT*5))+')';
      ctx.fillRect(ex-Math.cos(e.face)*8-1,ey-Math.sin(e.face)*8-1,3,3);
    }
    else if(e.kind==='sol'){
      drawHumanoid(ex,ey,e.r,e.face,{body:flash?'#e8e8e8':'#4a5a3a',hi:flash?'#fff':'#5c7046',
        head:'#333d26',visor:'#ff4a3a',walk:e.walk||0});
    }
    else if(e.kind==='elite'){
      drawHumanoid(ex,ey,e.r,e.face,{body:flash?'#e8e8e8':'#3a4252',hi:flash?'#fff':'#4d5872',
        head:'#262d3d',visor:'#ffb02a',walk:e.walk||0,plate:true});
    }
    else if(e.kind==='sol'&&e.shield){
      drawHumanoid(ex,ey,e.r,e.face,{body:flash?'#e8e8e8':'#3a4a3a',hi:flash?'#fff':'#4c604c',
        head:'#2a352a',visor:'#ff4a3a',walk:e.walk||0});
      // ön kalkan
      ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(ex,ey,e.r+3,e.face-0.9,e.face+0.9); ctx.stroke();
      ctx.lineWidth=1;
    }
    else if(e.kind==='drone'){
      const hov=Math.sin(raidT*8+e.phase)*1.5;
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(ex,ey+5,e.r,e.r*0.4,0,0,TAU); ctx.fill();
      ctx.fillStyle=flash?'#fff':(e.stun>0?'#6a7a8a':'#3a4658'); ctx.beginPath(); ctx.arc(ex,ey+hov,e.r,0,TAU); ctx.fill();
      ctx.fillStyle='#20242f'; for(let k=0;k<4;k++){ const a=raidT*20+k*TAU/4; ctx.fillRect(ex+Math.cos(a)*e.r-1,ey+hov+Math.sin(a)*e.r-1,2,2); }
      ctx.fillStyle=e.stun>0?'#6ee7ff':'#ff4a3a'; ctx.fillRect(ex+Math.cos(e.face)*3-1,ey+hov+Math.sin(e.face)*3-1,2,2);
    }
    else if(e.kind==='spit'){
      drawBeast(ex,ey,e.r,e.face,e.walk||0,flash);
      ctx.fillStyle='rgba(138,255,90,'+(0.4+0.3*Math.sin(raidT*6))+')';
      ctx.fillRect(ex+Math.cos(e.face)*5-1,ey+Math.sin(e.face)*5-1,3,3);
    }
    else if(e.kind==='hound'){ drawBeast(ex,ey,e.r,e.face,e.walk||0,flash); }
    else { drawSui(ex,ey,e.r,e.face,e.walk||0,flash); }
    if(e.stun>0){ ctx.fillStyle='#6ee7ff'; ctx.fillText('*',ex,ey-e.r-4); }
    if(e.hp<e.maxhp&&e.kind!=='boss'){
      ctx.fillStyle='#222'; ctx.fillRect(ex-8,ey-e.r-6,16,2);
      ctx.fillStyle='#ff4a4a'; ctx.fillRect(ex-8,ey-e.r-6,16*(e.hp/e.maxhp),2);
    }
    if(player.markT>0&&dist(e.x,e.y,player.x,player.y)<280){
      ctx.strokeStyle='rgba(138,255,122,'+(0.5+0.3*Math.sin(raidT*6))+')';
      ctx.strokeRect(ex-e.r-3,ey-e.r-3,(e.r+3)*2,(e.r+3)*2);
    }
    // combat aim telegraph
    if((e.kind==='sol'||e.kind==='elite')&&e.state==='combat'&&e.aimT>0.15){
      ctx.strokeStyle='rgba(255,70,50,0.25)';
      ctx.beginPath(); ctx.moveTo(ex,ey);
      const [lx,ly]=w2s(e.lastX,e.lastY);
      ctx.lineTo(lx,ly); ctx.stroke();
    }
  }
  // player
  {
    const [px,py]=w2s(player.x,player.y);
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(px,py+5,6,3,0,0,TAU); ctx.fill();
    const blink=player.inv>0&&Math.sin(raidT*40)>0;
    const opCol=(OPERATORS[save.operator]||OPERATORS.sentinel).col;
    if(player.stealthT>0)ctx.globalAlpha=0.4;
    drawHumanoid(px,py,player.r,player.face,{
      body:blink?'#9fd8ff':'#2a3450',hi:blink?'#c8ecff':'#3a4a68',
      head:'#171c2a',visor:opCol,walk:player.walk||0,pack:'#1a2233'});
    ctx.globalAlpha=1;
    if(player.bastionT>0){
      ctx.strokeStyle='rgba(122,176,255,'+(0.35+0.2*Math.sin(raidT*8))+')';
      ctx.beginPath(); ctx.arc(px,py,11,0,TAU); ctx.stroke();
    }
    if(player.stimT>0){
      ctx.strokeStyle='rgba(255,122,154,0.4)';
      ctx.beginPath(); ctx.arc(px,py,9,raidT*6,raidT*6+2); ctx.stroke();
    }
  }
  // mobil lazer nişan ışını (glow + pulse; kilitte kırmızıya döner)
  if(laserEnd.on&&touchAim.active&&player){
    const [la,lb]=w2s(player.x,player.y), [lc,ld]=w2s(laserEnd.x,laserEnd.y);
    const lock=!!aimLock, pulse=0.55+0.3*Math.sin(raidT*12), lcol=lock?'#ff5a4a':'#6ee7ff';
    ctx.globalAlpha=0.22*pulse; ctx.strokeStyle=lcol; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(la,lb); ctx.lineTo(lc,ld); ctx.stroke();
    ctx.globalAlpha=lock?0.95:0.6; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(la,lb); ctx.lineTo(lc,ld); ctx.stroke();
    ctx.fillStyle=lock?'#ff8a6a':'#aef2ff'; ctx.fillRect(lc-1,ld-1,3,3);
    ctx.globalAlpha=1;
    if(rand()<0.3)parts.push({x:laserEnd.x,y:laserEnd.y,vx:R(-15,15),vy:R(-15,15),life:0.15,max:0.15,col:lock?'#ff8a6a':'#6ee7ff',size:1,fric:4});
    addLight(laserEnd.x,laserEnd.y,18,0.03,lock?'255,90,74':'110,231,255');
  }
  // bullets
  for(const b of bullets){
    const [bx,by]=w2s(b.x,b.y);
    const vl=Math.hypot(b.vx,b.vy)||1;
    ctx.strokeStyle=b.col;
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.lineTo(bx-b.vx/vl*7,by-b.vy/vl*7); ctx.stroke();
  }
  // particles
  for(const pt of parts){
    const [px,py]=w2s(pt.x,pt.y);
    ctx.globalAlpha=clamp(pt.life/pt.max,0,1);
    ctx.fillStyle=pt.col; ctx.fillRect(px-pt.size/2,py-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;
  // hasar sayıları
  ctx.textAlign='center'; ctx.font='8px monospace';
  for(const fd of floatDmg){
    const [px,py]=w2s(fd.x,fd.y);
    ctx.globalAlpha=clamp(fd.t/0.7,0,1);
    ctx.fillStyle=fd.crit?'#ffe08a':'#e8e8f0';
    ctx.font=fd.crit?'bold 10px monospace':'8px monospace';
    ctx.fillText(fd.v,px,py);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
  // ---- LIGHTING ----
  lctx.globalCompositeOperation='source-over';
  lctx.fillStyle='rgba(4,5,12,'+Math.min(0.94,SEC.amb+ambBonus)+')';
  lctx.clearRect(0,0,VW,VH);
  lctx.fillRect(0,0,VW,VH);
  lctx.globalCompositeOperation='destination-out';
  const punch=(x,y,r,a)=>{
    const g=lctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,'+a+')'); g.addColorStop(1,'rgba(255,255,255,0)');
    lctx.fillStyle=g; lctx.beginPath(); lctx.arc(x,y,r,0,TAU); lctx.fill();
  };
  { const [px,py]=w2s(player.x,player.y); punch(px,py,105,0.95);
    // fener konisi
    for(let i=1;i<=4;i++)punch(px+Math.cos(player.face)*i*26,py+Math.sin(player.face)*i*26,34,0.5);
  }
  { const [ex,ey]=w2s(extract.x,extract.y); punch(ex,ey,60,0.7); }
  for(const a of anomalies){ const [ax,ay]=w2s(a.x,a.y); punch(ax,ay,a.r*0.8,0.3); }
  for(const li of lights){ const [lx,ly]=w2s(li.x,li.y); punch(lx,ly,li.r,0.8*(li.t/li.max)); }
  for(const pk of pickups)if(pk.type==='artifact'){ const [px,py]=w2s(pk.x,pk.y); punch(px,py,30,0.5); }
  for(const pr of props){
    if(pr.dead)continue;
    if(pr.type==='lamp'&&!pr.off){ const [lx,ly]=w2s(pr.x,pr.y); punch(lx,ly-10,52,0.45+0.12*Math.sin(raidT*7+pr.ph)); }
    else if(pr.type==='terminal'&&!pr.used){ const [lx,ly]=w2s(pr.x,pr.y); punch(lx,ly,26,0.4); }
  }
  if(player.markT>0)for(const e of enemies){
    if(dist(e.x,e.y,player.x,player.y)<280){ const [ex,ey]=w2s(e.x,e.y); punch(ex,ey,26,0.5); }
  }
  for(const e of enemies)if(e.kind==='boss'&&e.aware){ const [bx,by]=w2s(e.x,e.y); punch(bx,by,84,0.55); }
  ctx.drawImage(lightCv,0,0);
  // renk halkaları (ambiyans)
  for(const li of lights){
    const [lx,ly]=w2s(li.x,li.y);
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,li.r);
    g.addColorStop(0,'rgba('+li.col+','+(0.22*(li.t/li.max))+')'); g.addColorStop(1,'rgba('+li.col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,ly,li.r,0,TAU); ctx.fill();
  }
  drawWeather(sx,sy);
  drawHUD(w2s);
  if(hurtFlash>0){
    ctx.strokeStyle='rgba(255,30,30,'+(hurtFlash*0.8*(0.4+0.6*save.settings.flash))+')'; ctx.lineWidth=8;
    ctx.strokeRect(4,4,VW-8,VH-8); ctx.lineWidth=1;
  }
  if(player.hp<player.maxhp*0.3){
    const a=0.3*(1-player.hp/(player.maxhp*0.3));
    const g=ctx.createRadialGradient(VW/2,VH/2,VH*0.32,VW/2,VH/2,VH*0.72);
    g.addColorStop(0,'rgba(120,0,0,0)'); g.addColorStop(1,'rgba(120,0,0,'+(0.22+a)+')');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  }
  if(paused){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#e8e8f0'; ctx.font='16px monospace'; ctx.textAlign='center';
    ctx.fillText('DURAKLATILDI',VW/2,VH/2-14);
    ctx.font='9px monospace';
    if(isTouch){
      ctx.fillStyle='#8fd8a8'; ctx.fillText('▶ DEVAM',VW/6,VH/2+8);
      ctx.fillStyle='#8fb8ff'; ctx.fillText('⚙ AYARLAR',VW/2,VH/2+8);
      ctx.fillStyle='#ff8a6a'; ctx.fillText(escAsk>0?'✕ EMİN MİSİN?':'✕ TERK',VW*5/6,VH/2+8);
    } else {
      ctx.fillStyle='#8a8f9f';
      ctx.fillText('[P] devam et      [Y] ayarlar      çift [ESC] raid\'i terk et',VW/2,VH/2+8);
    }
    ctx.textAlign='left';
  }
  if(state==='dying'){
    const a=clamp(1-deathT/0.9,0,1);
    ctx.fillStyle='rgba(60,0,0,'+(a*0.55)+')'; ctx.fillRect(0,0,VW,VH);
  }
  if(state==='dead')drawDead();
  if(state==='extracted')drawExtracted();
  present();
}
// ---------- SPRITE ÇİZİMLERİ (gerçek üstten görünüm) ----------
// İnsansı: ayaklar (yürüyüş animasyonlu) + sırt çantası + gövde + omuz
// plakaları + silah tutan eller + kask + öne bakan vizör.
function drawHumanoid(x,y,r,face,pal){
  const s=r/6;
  ctx.save(); ctx.translate(x,y); ctx.rotate(face);
  // ayaklar — yürüyüş döngüsü
  const st=Math.sin(pal.walk||0)*2.6*s;
  ctx.fillStyle='#0d1016';
  ctx.fillRect(-1.2*s+st,-4.6*s,3*s,2.4*s);
  ctx.fillRect(-1.2*s-st,2.2*s,3*s,2.4*s);
  // sırt çantası (arkada)
  ctx.fillStyle=pal.pack||'#161b26';
  ctx.fillRect(-5.6*s,-2.4*s,2.4*s,4.8*s);
  // gövde
  ctx.fillStyle=pal.body;
  ctx.fillRect(-3.6*s,-3.6*s,7.2*s,7.2*s);
  // göğüs zırh şeridi
  ctx.fillStyle=pal.hi;
  ctx.fillRect(0.4*s,-2.6*s,2.4*s,5.2*s);
  // omuz plakaları
  ctx.fillStyle=pal.hi;
  ctx.fillRect(-2.6*s,-5.8*s,4.2*s,2.2*s);
  ctx.fillRect(-2.6*s,3.6*s,4.2*s,2.2*s);
  if(pal.plate){
    ctx.strokeStyle='#6a7488';
    ctx.strokeRect(-3.9*s,-3.9*s,7.8*s,7.8*s);
  }
  if(pal.gun!==false){
    // eller
    ctx.fillStyle='#3a4150';
    ctx.fillRect(2.2*s,-0.2*s,2*s,1.6*s);
    ctx.fillRect(0.6*s,1.4*s,2*s,1.6*s);
    // silah (namlu ileri bakar)
    ctx.fillStyle='#0b0d12';
    ctx.fillRect(1.4*s,0.2*s,9.6*s,1.3*s);
    ctx.fillStyle='#232936';
    ctx.fillRect(1.4*s,0.2*s,3*s,1.3*s);
  }
  // kask
  ctx.fillStyle=pal.head;
  ctx.beginPath(); ctx.arc(0.4*s,0,2.8*s,0,TAU); ctx.fill();
  // vizör (öne bakan)
  ctx.fillStyle=pal.visor;
  ctx.fillRect(1.6*s,-1.5*s,1.5*s,3*s);
  ctx.restore();
}
// Mutant köpek: 4 animasyonlu bacak + kuyruk + mutasyon şeridi + parlayan gözler + çene
function drawBeast(x,y,r,face,walk,flash){
  const s=r/5;
  ctx.save(); ctx.translate(x,y); ctx.rotate(face);
  const st=Math.sin(walk||0)*2*s;
  ctx.fillStyle='#3c2c18';
  ctx.fillRect(-7.5*s,-0.8*s,3*s,1.6*s);

  ctx.fillRect(2*s-st,2.2*s,2*s,2*s);
  ctx.fillRect(-3.4*s-st,-4.2*s,2*s,2*s);
  ctx.fillRect(-3.4*s+st,2.2*s,2*s,2*s);
  ctx.fillStyle=flash?'#fff':'#6a4a2a';
  ctx.beginPath(); ctx.ellipse(-0.4*s,0,5.4*s,3.1*s,0,0,TAU); ctx.fill();
  ctx.fillStyle='#8a2a3a';
  ctx.fillRect(-4*s,-0.9*s,6.4*s,1.8*s);
  ctx.fillStyle=flash?'#fff':'#7a5632';
  ctx.beginPath(); ctx.ellipse(5*s,0,2.6*s,2.2*s,0,0,TAU); ctx.fill();
  ctx.fillStyle='#4c3620';
  ctx.fillRect(3.4*s,-3*s,1.6*s,1.5*s);
  ctx.fillRect(3.4*s,1.5*s,1.6*s,1.5*s);
  ctx.fillStyle='#ff5a2a';
  ctx.fillRect(5.6*s,-1.7*s,1.1*s,1.1*s);
  ctx.fillRect(5.6*s,0.6*s,1.1*s,1.1*s);
  ctx.fillStyle='#1c130a';
  ctx.fillRect(6.8*s,-0.9*s,1.6*s,1.8*s);

}
// Canlı bomba: kambur gövde, öne uzanan kollar, göğüste nabız atan çekirdek
function drawSui(x,y,r,face,walk,flash){
  const s=r/5;
  const pulse=0.55+0.45*Math.sin(raidT*12);
  ctx.save(); ctx.translate(x,y); ctx.rotate(face);
  const st=Math.sin(walk||0)*2.4*s;

  ctx.fillRect(-1*s-st,1.8*s,2.6*s,2*s);

// The Source: gerçekliğin enfekte bağışıklık tepkisi — dönen psionik kütle
function drawBoss(x,y,e){
  const t=raidT;
  for(let i=0;i<3;i++){
    ctx.strokeStyle='rgba(196,122,255,'+(0.22+0.12*Math.sin(t*3+i*2))+')';
    ctx.beginPath(); ctx.arc(x,y,e.r+4+i*5+Math.sin(t*2+i)*2,0,TAU); ctx.stroke();
  }
  ctx.fillStyle=e.flash>0?'#fff':'#1a0f2a';
  ctx.beginPath(); ctx.arc(x,y,e.r,0,TAU); ctx.fill();
  ctx.strokeStyle='#c47aff';
  ctx.beginPath(); ctx.arc(x,y,e.r,0,TAU); ctx.stroke();
  for(let i=0;i<5;i++){
    const a=t*(1+i*0.3)+i*TAU/5;
    ctx.fillStyle='#c47aff';
    ctx.fillRect(x+Math.cos(a)*(e.r+6)-1,y+Math.sin(a)*(e.r+6)-1,2,2);
  }
  // göz oyuncuyu izler; faz 3'te kızıla döner
  ctx.fillStyle=e.phase===3?'#ff2a4a':'#e8d8ff';
  ctx.beginPath(); ctx.arc(x+Math.cos(e.face)*4,y+Math.sin(e.face)*4,3,0,TAU); ctx.fill();
  ctx.fillStyle='#0a0612';
  ctx.beginPath(); ctx.arc(x+Math.cos(e.face)*5,y+Math.sin(e.face)*5,1.4,0,TAU); ctx.fill();
  if(e.telT>0){
    ctx.strokeStyle='rgba(255,42,74,'+(0.4+0.3*Math.sin(t*30))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(e.face)*70,y+Math.sin(e.face)*70); ctx.stroke();
    ctx.lineWidth=1;
  }
}
// Ekran-uzayı hava efekti — deterministik, durum tutmaz (ucuz)
function drawWeather(sx,sy){
  const sis=raidMod&&raidMod.k==='sis';
  const snow=SEC===SECTORS[3]; // Buzul Üssü
  const acid=SEC===SECTORS[2]; // Kimyasal Fabrika
  if(sis){
    // sürüklenen sis bulutları (parallax)
    for(let i=0;i<10;i++){
      const bx=((i*173-sx*0.3)%(VW+120))-60, by=(i*97)%VH;
      const g=ctx.createRadialGradient(bx,by,0,bx,by,80);
      g.addColorStop(0,'rgba(150,165,185,0.05)'); g.addColorStop(1,'rgba(150,165,185,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,80,0,TAU); ctx.fill();
    }
  }
  if(snow){
    ctx.fillStyle='rgba(220,235,255,0.7)';
    for(let i=0;i<70;i++){
      const x=((i*137.5+raidT*20-sx*0.5)%(VW+20)+VW+20)%(VW+20)-10;
      const y=((i*89.3+raidT*40+Math.sin(raidT+i)*10)%(VH+20)+VH+20)%(VH+20)-10;
      ctx.fillRect(x,y,1.5,1.5);
    }
  }
  if(acid){
    ctx.strokeStyle='rgba(138,255,90,0.14)'; ctx.lineWidth=1;
    for(let i=0;i<50;i++){
      const x=((i*167-sx*0.6)%(VW+20)+VW+20)%(VW+20)-10;
      const y=((i*211+raidT*260)%(VH+30)+VH+30)%(VH+30)-15;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-1,y+6); ctx.stroke();
    }
    ctx.lineWidth=1;
  }
}

      if(player.charge>=1){ ctx.fillStyle='#c47aff'; ctx.textAlign='center'; ctx.fillText('TAM ŞARJ — DELİCİ',mouse.x,mouse.y+42); ctx.textAlign='left'; }
    }
  }
  // --- mobil dokunmatik kontroller (cam butonlar + joystick) ---
  touchBtnsCache.length=0;
  if(isTouch){
    const btn=(x,y,r,label,sub,on,prog,act)=>{
      touchBtnsCache.push({x,y,r,act,on});
      ctx.globalAlpha=on?0.8:0.32;
      ctx.fillStyle='rgba(16,22,38,0.55)'; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.strokeStyle=on?'rgba(140,180,255,0.7)':'rgba(90,100,130,0.4)';
      ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
      if(prog!==undefined&&prog<1){ // cooldown/enerji halkası
        ctx.strokeStyle='rgba(196,122,255,0.9)';
        ctx.beginPath(); ctx.arc(x,y,r-2,-Math.PI/2,-Math.PI/2+TAU*clamp(prog,0,1)); ctx.stroke();
      }
      if(on&&prog!==undefined&&prog>=1){ // hazır: glow pulse
        ctx.strokeStyle='rgba(196,122,255,'+(0.4+0.35*Math.sin(raidT*6))+')';
        ctx.beginPath(); ctx.arc(x,y,r+2,0,TAU); ctx.stroke();
      }
      ctx.textAlign='center'; ctx.fillStyle=on?'#dce8ff':'#5a6272';
      ctx.font='bold 9px monospace'; ctx.fillText(label,x,y+3);
      if(sub){ ctx.font='6px monospace'; ctx.fillStyle='#8a93a8'; ctx.fillText(sub,x,y+r+8); }
      ctx.globalAlpha=1; ctx.textAlign='left'; ctx.font='8px monospace';
    };
    const abReady=player.energy>=OP.abCost;
    btn(VW-34,VH-92,20,'E',OP.ability,abReady,player.energy/OP.abCost,()=>useAbility());
    if(!OP.noDash)btn(VW-82,VH-66,17,'➤','DODGE',player.dashCD<=0&&player.stam>=25,undefined,()=>dash());
    btn(VW-34,VH-142,14,'R','',player.reloadT<=0,undefined,()=>startReload());
    btn(VW-76,VH-120,14,'⇄','',true,undefined,()=>cycleWeapon(1));
    if(player.meds>0)btn(VW-122,VH-92,14,'+','x'+player.meds,player.hp<player.maxhp,undefined,()=>onKeyDown('KeyH'));
    if(nearInteract)btn(VW-82,VH-166,16,'F','',true,undefined,()=>doInteract());
    btn(VW-MW-26,20,10,'II','',true,undefined,()=>{paused=!paused;});
    if(touchJoy.active){ // dinamik joystick — cam taban + enerji halkası
      ctx.globalAlpha=0.28; ctx.strokeStyle='#8fb8ff';
      ctx.beginPath(); ctx.arc(touchJoy.ox,touchJoy.oy,30,0,TAU); ctx.stroke();
      ctx.globalAlpha=0.5; ctx.fillStyle='rgba(140,180,255,0.4)';
      ctx.beginPath(); ctx.arc(touchJoy.ox+touchJoy.x*touchJoy.mag*26,touchJoy.oy+touchJoy.y*touchJoy.mag*26,11,0,TAU); ctx.fill();
      if(touchJoy.mag>0.94){ ctx.strokeStyle='rgba(110,231,255,0.55)'; // sprint halkası
        ctx.beginPath(); ctx.arc(touchJoy.ox,touchJoy.oy,34+2*Math.sin(raidT*10),0,TAU); ctx.stroke(); }
      ctx.globalAlpha=1;
    }
    if(touchAim.active){ // nişan joystick'i (sağ) — kilitte kırmızı
      const ac=aimLock?'255,120,90':'110,225,255';
      ctx.globalAlpha=0.28; ctx.strokeStyle='rgba('+ac+',1)';
      ctx.beginPath(); ctx.arc(touchAim.ox,touchAim.oy,26,0,TAU); ctx.stroke();
      ctx.globalAlpha=0.5; ctx.fillStyle='rgba('+ac+',0.45)';
      ctx.beginPath(); ctx.arc(touchAim.ox+Math.cos(touchAim.ang)*touchAim.mag*22,
                               touchAim.oy+Math.sin(touchAim.ang)*touchAim.mag*22,10,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function drawMenuBg(t){
  ctx.fillStyle='#06070d'; ctx.fillRect(0,0,VW,VH);
  // yıldız alanı
  for(let i=0;i<70;i++){
    const x=(i*137.5)%VW, y=(i*89.3)%(VH*0.7);
    ctx.fillStyle='rgba(140,160,220,'+(0.03+((i*7)%12)/220)+')';
    ctx.fillRect(x,y,1,1);
  }
  // tutulma (eclipse) diski
  const ex=VW/2, ey=100;
  const g=ctx.createRadialGradient(ex,ey,28,ex,ey,120);
  g.addColorStop(0,'rgba(150,90,230,0.22)'); g.addColorStop(1,'rgba(150,90,230,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,120,0,TAU); ctx.fill();
  ctx.fillStyle='#0a0b13'; ctx.beginPath(); ctx.arc(ex,ey,42,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(196,122,255,'+(0.55+0.25*Math.sin(t*1.2))+')';
  ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,43,0,TAU); ctx.stroke(); ctx.lineWidth=1;
  // şehir silueti
  for(let i=0;i<42;i++){
    const h=24+((i*137)%68), x=i*16-8;
    ctx.fillStyle='#0a0c13';
    ctx.fillRect(x,VH-58-h,15,h+58);
    if((i*13)%7===0){
      ctx.fillStyle='rgba(255,190,110,'+(0.05+0.05*Math.sin(t*2+i))+')';
      ctx.fillRect(x+4,VH-70-((i*29)%h),3,3);
    }
    if((i*11)%9===0){
      ctx.fillStyle='rgba(110,231,255,0.07)';
      ctx.fillRect(x+9,VH-80-((i*17)%h),2,5);
    }
  }
  ctx.fillStyle='#05060b'; ctx.fillRect(0,VH-58,VW,58);
  // süzülen kül
  for(let i=0;i<26;i++){
    const y=((i*53.7+t*11)%VH), x=(i*197+Math.sin(t*0.7+i)*22)%VW;
    ctx.fillStyle='rgba(180,190,210,'+(0.05+(i%5)/60)+')';
    ctx.fillRect(x,y,1,1);
  }
  // tarama çizgileri
  ctx.fillStyle='rgba(0,0,0,0.10)';
  for(let y=0;y<VH;y+=4)ctx.fillRect(0,y,VW,1);
}

function drawEnding(){
  const t=performance.now()/1000;
  ctx.fillStyle='#05060c'; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<50;i++){ ctx.fillStyle='rgba(196,122,255,'+(0.03+(i%7)/120)+')'; ctx.fillRect((i*137.5)%VW,(i*89.3)%VH,1,1); }
  // sönen tutulma
  const ex=VW/2,ey=120, g=ctx.createRadialGradient(ex,ey,10,ex,ey,90);
  g.addColorStop(0,'rgba(150,90,230,'+(0.25+0.1*Math.sin(t))+')'); g.addColorStop(1,'rgba(150,90,230,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,90,0,TAU); ctx.fill();
  ctx.fillStyle='#0a0b13'; ctx.beginPath(); ctx.arc(ex,ey,34,0,TAU); ctx.fill();
  ctx.textAlign='center';
  ctx.fillStyle='#c47aff'; ctx.font='bold 20px monospace';
  ctx.fillText('THE SOURCE SUSTURULDU',VW/2,190);
  ctx.fillStyle='#c8ccd8'; ctx.font='10px monospace';

}

function present(){
  // başarım toast (buffer üstüne, her ekranda)
  if(achToast&&performance.now()-achToastT<3000){
    ctx.fillStyle='rgba(10,14,22,0.9)'; ctx.fillRect(VW/2-90,8,180,26);
    ctx.strokeStyle='#ffd24a'; ctx.strokeRect(VW/2-90,8,180,26);
    ctx.textAlign='center'; ctx.font='8px monospace';
    ctx.fillStyle='#ffd24a'; ctx.fillText('★ BAŞARIM: '+achToast.name,VW/2,20);
    ctx.fillStyle='#8a8f9f'; ctx.fillText(achToast.desc,VW/2,30);
    ctx.textAlign='left';
  }
  dctx.fillStyle='#000'; dctx.fillRect(0,0,disp.width,disp.height);
  dctx.imageSmoothingEnabled=false;
  dctx.drawImage(buf,offX,offY,VW*scale,VH*scale);
  // CRT tarama çizgileri (ayar)
  if(save.settings.crt){
    dctx.fillStyle='rgba(0,0,0,0.16)';
    for(let y=0;y<disp.height;y+=3)dctx.fillRect(0,y,disp.width,1);
  }
  // mobil dikey ekran: yatay çevir uyarısı (dctx tr() sarmalı değil — dil elle)
  if(isTouch&&innerHeight>innerWidth){
    dctx.fillStyle='rgba(4,6,14,0.93)'; dctx.fillRect(0,0,disp.width,disp.height);
    dctx.textAlign='center';
    dctx.fillStyle='#c47aff'; dctx.font='bold 22px monospace';
    dctx.fillText(save.lang==='en'?'ROTATE YOUR DEVICE':'CİHAZI YATAY ÇEVİR',disp.width/2,disp.height/2-16);
    dctx.fillStyle='#8a93a8'; dctx.font='13px monospace';
    dctx.fillText(save.lang==='en'?'ZIFIR plays in landscape':'ZİFİR yatay modda oynanır',disp.width/2,disp.height/2+12);
    dctx.textAlign='left';
  }
}

// ---------- MAIN LOOP ----------
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-lastT)/1000,0.033); lastT=now;
  if(state==='play'&&!paused){
    if(AC&&!windNode)startWind();
    if(AC&&!musicNodes)startMusic();
    if(hitstop>0)hitstop-=dt;
    else update(dt);
  } else if(state==='dying'){
    updateDying(dt);
    if(windNode)stopWind(); if(musicNodes)stopMusic();
  } else { if(windNode)stopWind(); if(musicNodes)stopMusic(); }
  draw();
}
requestAnimationFrame(loop);
window.onerror=(m)=>{ console.error('GAME ERROR: '+m); };
</script>
