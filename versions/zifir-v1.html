const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- AUDIO (WebAudio synth — asset yok) ----------
let AC=null, master=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.32*save.settings.sfx; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
// Konumsal ses: sfxAt(x,y,fn) çağrısı içindeki tone/noiseSfx'ler
// kaynağın oyuncuya göre yönünden (pan) ve uzaklığından (gain) etkilenir.
let sfxPan=0, sfxGain=1;
function sfxAt(x,y,fn){
  if(player&&(state==='play'||state==='dying')){
    const dx=x-player.x, d=dist(x,y,player.x,player.y);
    sfxPan=clamp(dx/260,-1,1);
    sfxGain=clamp(1-d/520,0.12,1);
  }
  try{ fn(); } finally { sfxPan=0; sfxGain=1; }
}
function outNode(g){
  if(AC.createStereoPanner&&sfxPan!==0){
    const pan=AC.createStereoPanner(); pan.pan.value=sfxPan;
    g.connect(pan); pan.connect(master);
  } else g.connect(master);
}
function tone(freq,dur,type,vol,slide){
  if(!AC)return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t0+dur);
  g.gain.setValueAtTime((vol||0.2)*sfxGain,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); outNode(g); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseSfx(dur,vol,freq,q){
  if(!AC)return;
  const t0=AC.currentTime, len=Math.max(1,Math.floor(AC.sampleRate*dur));
  const b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource(); n.buffer=b;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1000; f.Q.value=q||0.8;
  const g=AC.createGain(); g.gain.setValueAtTime((vol||0.3)*sfxGain,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  n.connect(f); f.connect(g); outNode(g); n.start(t0);
}
const SFX={
  shot(){ noiseSfx(0.12,0.45,1800,0.7); tone(220,0.08,'square',0.13,-160); },

  enemyshot(){ noiseSfx(0.1,0.25,1400,0.8); },

  geiger(){ noiseSfx(0.015,0.22,4200,3); },
  pickup(){ tone(660,0.07,'square',0.12,320); },
  artifact(){ tone(440,0.35,'sine',0.18,420); tone(660,0.35,'sine',0.1,420); },
  hurt(){ tone(150,0.15,'sawtooth',0.22,-60); },
  heartbeat(){ tone(52,0.13,'sine',0.5,-8); },

  death(){ tone(220,0.8,'sawtooth',0.2,-180); noiseSfx(0.5,0.3,500,0.6); },
};

}

  if(save.lang!=='en'||typeof s!=='string'||!s)return s;
  if(L_WHOLE[s]!==undefined)return L_WHOLE[s];

  for(let i=0;i<L_TOKEN.length;i++)out=out.split(L_TOKEN[i][0]).join(L_TOKEN[i][1]);
  return out;
}

// ---------- MOBİL DOKUNMATİK KATMAN ----------
// Sol yarım: dinamik joystick (parmak nereye basarsa orada doğar, taban parmağı izler).
// Sağ yarım: lazer nişan — ışın düşmana değdiği an otomatik ateş. Ateş butonu yok.
let isTouch=false;
const touchJoy={active:false,id:-1,ox:0,oy:0,x:0,y:0,mag:0};
const touchAim={active:false,id:-1,ox:0,oy:0,ang:0,mag:0}; // yön joystick'i: lazer ang yönünü izler
let aimLock=null;                      // lazerin kilitlendiği düşman
const laserEnd={on:false,x:0,y:0};     // ışının duvara/menzile çarptığı dünya noktası
const touchBtnsCache=[];               // drawHUD her karede doldurur; hit-test buradan
const touchBtnIds={};                  // buton tarafından tüketilen dokunuşlar
function vib(p){ if(!save.settings.haptics)return; try{ if(navigator.vibrate)navigator.vibrate(p); }catch(e){} }
function tPos(t){ return {x:clamp((t.clientX-offX)/scale,0,VW), y:clamp((t.clientY-offY)/scale,0,VH)}; }
function handleTouchStart(t){
  const p=tPos(t);
  if(state!=='play'){ if(state!=='dying')screenTap(p.x,p.y); return; }
  if(paused){ screenTap(p.x,p.y); return; }
  for(const b of touchBtnsCache){
    if(dist(p.x,p.y,b.x,b.y)<b.r+6){ touchBtnIds[t.identifier]=true; if(b.on!==false){ vib(10); b.act(); } return; }
  }
  if(p.x<VW*0.44&&!touchJoy.active){ touchJoy.active=true; touchJoy.id=t.identifier; touchJoy.ox=p.x; touchJoy.oy=p.y; touchJoy.x=0; touchJoy.y=0; touchJoy.mag=0; }
  else if(!touchAim.active){ touchAim.active=true; touchAim.id=t.identifier; touchAim.ox=p.x; touchAim.oy=p.y; touchAim.ang=player?player.face:0; touchAim.mag=0; }
}
function handleTouchMove(t){
  const p=tPos(t);
  if(touchJoy.active&&t.identifier===touchJoy.id){
    let dx=p.x-touchJoy.ox, dy=p.y-touchJoy.oy;
    const d=Math.hypot(dx,dy);
    if(d>44){ touchJoy.ox=p.x-dx/d*44; touchJoy.oy=p.y-dy/d*44; } // taban parmağı izler
    touchJoy.mag=d<3.8?0:clamp(d*(save.settings.touchSens||1)/32,0,1); // ölü bölge + hassasiyet
    if(d>0.01){ touchJoy.x=dx/d; touchJoy.y=dy/d; }
  } else if(touchAim.active&&t.identifier===touchAim.id){
    let dx=p.x-touchAim.ox, dy=p.y-touchAim.oy;
    const d=Math.hypot(dx,dy);
    if(d>44){ touchAim.ox=p.x-dx/d*44; touchAim.oy=p.y-dy/d*44; }
    if(d>5)touchAim.ang=Math.atan2(dy,dx); // 360° pürüzsüz yön
    touchAim.mag=clamp(d*(save.settings.touchSens||1)/26,0,1);
  }
}
function handleTouchEnd(t){
  if(touchBtnIds[t.identifier]){ delete touchBtnIds[t.identifier]; return; }
  if(touchJoy.active&&t.identifier===touchJoy.id){ touchJoy.active=false; touchJoy.mag=0; }
  if(touchAim.active&&t.identifier===touchAim.id){
    touchAim.active=false;
    if(state==='play'&&!paused&&player){ // şarjlı silah: bırakınca ateş
      const w=WEAPONS[player.weapons[player.wi]];
      if(w.charge&&player.charge>0.2){ fireWeapon(player.charge); player.charge=0; }
    }
    aimLock=null; laserEnd.on=false;
  }
}
addEventListener('touchstart',e=>{ isTouch=true; initAudio(); if(e.cancelable)e.preventDefault(); for(const t of e.changedTouches)handleTouchStart(t); },{passive:false});
addEventListener('touchmove',e=>{ if(e.cancelable)e.preventDefault(); for(const t of e.changedTouches)handleTouchMove(t); },{passive:false});
addEventListener('touchend',e=>{ if(e.cancelable)e.preventDefault(); for(const t of e.changedTouches)handleTouchEnd(t); },{passive:false});
addEventListener('touchcancel',e=>{ for(const t of e.changedTouches)handleTouchEnd(t); },{passive:false});
// Ekran dokunuşu → menü eylemi. Çizim koordinatlarıyla birebir aynı bölgeler.
// Fare tıklaması da buradan geçer (masaüstü QoL).
function screenTap(x,y){
  const send=c=>{ vib(8); onKeyDown(c); };
  if(state==='menu'){
    if(y<26&&x>VW-130)return send('KeyL');
    if(y>=VH-48&&y<=VH-28){ const seg=clamp(Math.floor(x/(VW/8)),0,7); return send(['KeyO','KeyB','KeyM','KeyG','KeyJ','KeyC','KeyY','KeyT'][seg]); }
    if(y>=152&&y<=228){ if(x>=92&&x<=306)return send('KeyO'); if(x>=334&&x<=548)return send('KeyB'); }
    if(y>=264&&y<=300)return send('Enter');
    return;
  }
  if(state==='opselect'){
    const cw=96,gap=6,total=OPKEYS.length*cw+(OPKEYS.length-1)*gap,x0=(VW-total)/2;
    if(y>=70&&y<=170&&x>=x0&&x<=x0+total){
      const i=Math.floor((x-x0)/(cw+gap));
      if(i>=0&&i<OPKEYS.length&&x-x0-i*(cw+gap)<=cw){
        if(i===selOpIdx)return send('Enter');
        selOpIdx=i; SFX.geiger(); vib(8); return;
      }
    }
    if(y>=188&&y<=280&&x>=120&&x<=520)return send('Enter');
    return send('Escape');
  }
  if(state==='secselect'){
    for(let i=0;i<SECTORS.length;i++){ const ry=64+i*47;
      if(y>=ry&&y<=ry+40&&x>=90&&x<=550){ if(i===selSecIdx)return send('Enter'); selSecIdx=i; SFX.geiger(); vib(8); return; } }
    return send('Escape');
  }
  if(state==='market'){
    for(let i=0;i<8;i++){ const ry=80+i*31; if(y>=ry&&y<=ry+27&&x>=100&&x<=540)return send('Digit'+(i+1)); }
    return send('Escape');
  }
  if(state==='hideout'){
    for(let i=0;i<HIDEOUT.length;i++){ const ry=74+i*44;
      if(y>=ry&&y<=ry+38&&x>=100&&x<=540){ if(i===selHideIdx)return send('Enter'); selHideIdx=i; SFX.geiger(); vib(8); return; } }
    return send('Escape');
  }
  if(state==='settings'){
    for(let i=0;i<10;i++){ const ry=56+i*29;
      if(y>=ry&&y<=ry+25&&x>=120&&x<=520){ selSetIdx=i; if(i<4||i===9)return send(x<VW/2?'KeyA':'KeyD'); return send('Enter'); } }
    return send('Escape');
  }
  if(state==='codex'||state==='journal')return send('Escape');
  if(state==='dead')return send('Enter');
  if(state==='extracted'){ if(dailyMode&&y>=228&&y<=252)return send('KeyC'); return send('Enter'); }
  if(state==='play'&&paused){
    if(y>=VH/2&&y<=VH/2+22){ if(x<VW/3)return send('KeyP'); if(x<VW*2/3)return send('KeyY'); return send('Escape'); }
    return send('KeyP');
  }
}

const tileAt=(tx,ty)=>(tx<0||ty<0||tx>=MW||ty>=MH)?1:map[ty*MW+tx];
const solidPx=(x,y)=>tileAt(Math.floor(x/TILE),Math.floor(y/TILE))===1;

function propAt(x,y,r){
  for(const p of props){ if(p.dead||p.type==='corpse')continue; if(dist(x,y,p.x,p.y)<p.r+r)return p; }
  return null;
}
function hitSolid(x,y,r){
  if(solidPx(x-r,y-r)||solidPx(x+r,y-r)||solidPx(x-r,y+r)||solidPx(x+r,y+r))return true;
  // r>7: köşeler tek karoluk duvarı ıskalayabilir — kenar orta noktalarını da örnekle
  if(r>7&&(solidPx(x-r,y)||solidPx(x+r,y)||solidPx(x,y-r)||solidPx(x,y+r)))return true;
  return !!propAt(x,y,r);
}
function moveCirc(e,dx,dy){
  const nx=e.x+dx; if(!hitSolid(nx,e.y,e.r))e.x=nx;
  const ny=e.y+dy; if(!hitSolid(e.x,ny,e.r))e.y=ny;
}
// Görüş hattı: DDA tile raycast
function losClear(x0,y0,x1,y1){
  const d=dist(x0,y0,x1,y1), steps=Math.ceil(d/6);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(solidPx(lerp(x0,x1,t),lerp(y0,y1,t)))return false;
  }
  return true;
}

// ---------- MAP GEN — MAKRO PLANLI PROSEDÜREL ----------
// Rastgele ama mantıklı: (1) bölge planı — spawn köşesi, extraction köşesi,
// merkez "kasa" bölgesi, bir çeyrek "anomali sahası"; (2) ana yollar spawn→
// merkez→exfil omurgası; (3) yol kenarına çok odalı COMPOUND binalar (tema
// gruplu: kışla/revir/laboratuvar...); (4) vahşi alan dolgusu; (5) BFS garantisi.
let roadMap=null;
function carveRoad(x0,y0,x1,y1){
  const mark=(x,y)=>{
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
      const tx=clamp(x+dx,2,MW-3),ty=clamp(y+dy,2,MH-3);
      map[ty*MW+tx]=0; roadMap[ty*MW+tx]=1;
    }
  };
  let x=x0;
  while(x!==x1){ mark(x,y0); x+=Math.sign(x1-x); }
  let y=y0;
  while(y!==y1){ mark(x1,y); y+=Math.sign(y1-y); }
  mark(x1,y1);
}
function rectTouches(x0,y0,w,h,fn){
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){
    if(x<0||y<0||x>=MW||y>=MH)return true;
    if(fn(y*MW+x))return true;
  }
  return false;
}
// Compound: dış duvarlı bina, 2-3 odaya bölünür (iç kapılı), 2 dış kapı.
// Odalar temalarıyla ruins listesine girer — startRaid yerleşimi temayı kullanır.
function buildCompound(x0,y0,w,h,themes,ruins){
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){
    if(x===x0||y===y0||x===x0+w-1||y===y0+h-1)map[y*MW+x]=1;
  }
  let rooms=[{x0,y0,w,h}];
  if(w>=h&&w>=9){
    const sx=x0+RI(4,w-5);
    for(let y=y0;y<y0+h;y++)map[y*MW+sx]=1;
    map[(y0+RI(1,h-2))*MW+sx]=0;
    rooms=[{x0,y0,w:sx-x0+1,h},{x0:sx,y0,w:x0+w-sx,h}];
  } else if(h>=9){
    const sy=y0+RI(4,h-5);
    for(let x=x0;x<x0+w;x++)map[sy*MW+x]=1;
    map[sy*MW+(x0+RI(1,w-2))]=0;
    rooms=[{x0,y0,w,h:sy-y0+1},{x0,y0:sy,w,h:y0+h-sy}];
  }
  const big=rooms.reduce((a,b)=>(a.w*a.h>b.w*b.h?a:b));
  if(rooms.length===2&&big.h>=9&&big.w>=6){
    const sy=big.y0+RI(4,big.h-5);
    for(let x=big.x0;x<big.x0+big.w;x++)map[sy*MW+x]=1;
    map[sy*MW+(big.x0+RI(1,big.w-2))]=0;
    const idx=rooms.indexOf(big);
    rooms.splice(idx,1,
      {x0:big.x0,y0:big.y0,w:big.w,h:sy-big.y0+1},
      {x0:big.x0,y0:sy,w:big.w,h:big.y0+big.h-sy});
  }
  for(let g=0;g<2;g++){
    const side=RI(0,3);
    if(side===0)map[y0*MW+(x0+RI(2,w-3))]=0;
    else if(side===1)map[(y0+h-1)*MW+(x0+RI(2,w-3))]=0;
    else if(side===2)map[(y0+RI(2,h-3))*MW+x0]=0;
    else map[(y0+RI(2,h-3))*MW+(x0+w-1)]=0;
  }
  rooms.forEach((rm,i)=>ruins.push({x0:rm.x0,y0:rm.y0,w:rm.w,h:rm.h,theme:themes[i%themes.length]}));
}
function genMap(seed){
  rand=mulberry32(seed);
  map=new Uint8Array(MW*MH);
  roadMap=new Uint8Array(MW*MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2)map[y*MW+x]=1;
  }
  // 1) bölge planı
  const spawn={x:5,y:5};
  const corners=[{x:MW-6,y:MH-6},{x:MW-6,y:6},{x:6,y:MH-6}];
  const ec=corners[RI(0,2)];
  const C={x:MW>>1,y:MH>>1};
  const quads=[
    {x0:4,y0:(MH>>1),w:(MW>>1)-4,h:(MH>>1)-6},
    {x0:(MW>>1),y0:4,w:(MW>>1)-6,h:(MH>>1)-4},
    {x0:(MW>>1),y0:(MH>>1),w:(MW>>1)-6,h:(MH>>1)-6},
  ];
  const anomZone=quads[RI(0,2)];
  // 2) ana yollar: omurga
  carveRoad(spawn.x,spawn.y,C.x,C.y);
  carveRoad(C.x,C.y,ec.x,ec.y);
  carveRoad(C.x,C.y,corners[RI(0,2)].x,corners[RI(0,2)].y);
  // 3) compound binalar — yol/bina çakışması yok, merkezdeki "kasa" zengin
  const ruins=[];
  const compTypes=[
    ['armory','dorm'],
    ['medbay','storage'],
    ['archive','generator'],
    ['storage','armory'],
    ['dorm','generator'],
  ];
  let placedC=0;
  for(let tries=0;tries<240&&placedC<8;tries++){
    const w=RI(9,14),h=RI(8,13);
    const x0=RI(4,MW-5-w),y0=RI(4,MH-5-h);
    if(x0<12&&y0<12)continue;
    if(Math.abs(x0+w/2-ec.x)<8&&Math.abs(y0+h/2-ec.y)<8)continue;
    if(rectTouches(x0-2,y0-2,w+4,h+4,t=>map[t]===1||roadMap[t]===1))continue;
    const central=Math.abs(x0+w/2-C.x)<12&&Math.abs(y0+h/2-C.y)<12;
    buildCompound(x0,y0,w,h,central?['storage','archive','armory']:compTypes[RI(0,compTypes.length-1)],ruins);
    placedC++;
  }
  // 4) vahşi alan: seyrek moloz duvarları (yollara değmez)
  for(let i=0;i<18;i++){
    const x=RI(6,MW-7),y=RI(6,MH-7),n=RI(1,4);
    if(x<12&&y<12)continue;
    let onRoad=false;
    for(let j=0;j<n;j++)if(roadMap[y*MW+clamp(x+j,0,MW-1)]){onRoad=true;break;}
    if(onRoad)continue;
    for(let j=0;j<n;j++)map[clamp(y+RI(-1,1),0,MH-1)*MW+clamp(x+j,0,MW-1)]=1;
  }
  clearArea(spawn.x,spawn.y,3);
  clearArea(ec.x,ec.y,3);
  // erişilebilirlik garantisi (yollar zaten omurga — fallback nadiren gerekir)
  computeReach(spawn.x,spawn.y);
  if(!reach[ec.y*MW+ec.x]){
    let cx=spawn.x,cy=spawn.y;
    while(cx!==ec.x||cy!==ec.y){
      if(cx!==ec.x)cx+=Math.sign(ec.x-cx);
      if(cy!==ec.y)cy+=Math.sign(ec.y-cy);
      clearArea(cx,cy,1);
    }
    computeReach(spawn.x,spawn.y);
  }
  reachList=[];
  for(let i=0;i<MW*MH;i++)if(reach[i])reachList.push(i);
  // minimap prerender (yollar dahil — navigasyon aracı)
  miniCv=document.createElement('canvas'); miniCv.width=MW; miniCv.height=MH;
  const mc=miniCv.getContext('2d');
  mc.fillStyle='#0a0d18'; mc.fillRect(0,0,MW,MH);
  mc.fillStyle='#1e2436';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(roadMap[y*MW+x]&&!map[y*MW+x])mc.fillRect(x,y,1,1);
  mc.fillStyle='#3a4260';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(map[y*MW+x])mc.fillRect(x,y,1,1);
  return {spawn,ec,ruins,anomZone};
}
function clearArea(tx,ty,r){
  for(let y=ty-r;y<=ty+r;y++)for(let x=tx-r;x<=tx+r;x++)
    if(x>1&&y>1&&x<MW-2&&y<MH-2)map[y*MW+x]=0;
}
function computeReach(sx,sy){
  reach=new Uint8Array(MW*MH);
  const q=[sy*MW+sx]; reach[q[0]]=1;
  while(q.length){
    const i=q.pop(), x=i%MW, y=(i/MW)|0;
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const [nx,ny] of nb){
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const j=ny*MW+nx;
      if(!map[j]&&!reach[j]){reach[j]=1;q.push(j);}
    }
  }
}
function randReachTile(minDistTiles,fromX,fromY){
  for(let tries=0;tries<400;tries++){
    const i=reachList[RI(0,reachList.length-1)];
    const x=i%MW,y=(i/MW)|0;
    if(dist(x,y,fromX,fromY)>=minDistTiles)return {x,y};
  }
  return {x:fromX+3,y:fromY+3};
}
function openTile(tx,ty){ // etrafı açık mı (prop yerleşimi için)
  let open=0;
  for(let y=ty-1;y<=ty+1;y++)for(let x=tx-1;x<=tx+1;x++)if(!tileAt(x,y))open++;
  return open>=8;
}

// ---------- SPAWN / RAID START ----------
function startRaid(opts){
  opts=opts||{};
  dailyMode=!!opts.daily;
  newUnlock=null; deathInfo=null; ambBonus=0;
  if(dailyMode){
    const d=new Date();
    const key=d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();
    raidSeed=(key*2654435761)>>>0;
    SEC=SECTORS[key%SECTORS.length];
  } else {
    save.sector=clamp(save.sector,0,save.maxSector);
    SEC=SECTORS[save.sector];
    raidSeed=(Date.now()^(save.raids*7919))>>>0;
  }
  const {spawn,ec,ruins,anomZone}=genMap(raidSeed);
  enemies=[];bullets=[];parts=[];decals=[];pickups=[];props=[];anomalies=[];msgs=[];noiseEvents=[];lights=[];hazards=[];
  raidT=0; huntersSent=false; shake=0; hitstop=0; hurtFlash=0; escAsk=0; paused=false;
  camKick.x=0; camKick.y=0; deathT=0; raidXP=0; floatDmg=[]; bossKilledThisRaid=false; storyAdvanced=null;
  tutStep=(!save.tutorialDone&&!dailyMode)?0:-1; tutTimer=3;
  if(!save.ops[save.operator])save.operator='sentinel'; // kilitli operatörle raid imkânsız
  extract={x:(ec.x+0.5)*TILE,y:(ec.y+0.5)*TILE,r:26,t:0,beatT:0};
  const px=(spawn.x+0.5)*TILE, py=(spawn.y+0.5)*TILE;
  const wl=dailyMode?['pistol','carbine','shotgun','sniper','smg','dmr','lmg']
    :(()=>{const a=['pistol','carbine'];
      if(save.shotgun)a.push('shotgun'); if(save.sniper)a.push('sniper');
      if(save.smg)a.push('smg'); if(save.dmr)a.push('dmr'); if(save.lmg)a.push('lmg');
      return a;})();
  wl.push('knife'); // bıçak her zaman elde — sessiz eliminasyon
  const ammo={};
  for(const k of wl)ammo[k]={mag:WEAPONS[k].mag,res:WEAPONS[k].mag*(k==='sniper'?4:k==='shotgun'?6:5)};
  const OP=OPERATORS[save.operator]||OPERATORS.sentinel;
  const hpBonus=(save.hideout.revir||0)*15;
  player={x:px,y:py,r:6,hp:OP.hp+hpBonus,maxhp:OP.hp+hpBonus,stam:100,speed:OP.spd,energy:100,
    stealthT:0,markT:0,bastionT:0,stimT:0,
    dashT:0,dashCD:0,inv:0,vx:0,vy:0,
    credits:0,kills:0,artifacts:0,keycards:0,
    weapons:wl,wi:1,ammo,reloadT:0,fireT:0,recIdx:0,recRec:0,charge:0,shots:0,
    stepT:0,latch:false,face:0,walk:0,meds:0,plate:0,lastHits:[],lastEnv:null,
    perks:[],masteryGain:{},noFire:true};
  cam.x=px; cam.y=py;
  // --- stash tüketimi (marketten alınanlar raid'e taşınır) ---
  player.meds=Math.min(3,save.stash.med); save.stash.med-=player.meds;
  if(save.stash.ammo>0){ save.stash.ammo--; for(const k of wl)ammo[k].res=Math.round(ammo[k].res*1.5); }
  if(save.stash.plate>0){ save.stash.plate--; player.plate=150; }
  persist();
  // proplar: sandık + varil
  for(let i=0;i<SEC.crates;i++){
    const t=randReachTile(8,spawn.x,spawn.y);
    if(!openTile(t.x,t.y))continue;
    const barrel=rand()<0.3;
    props.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:6,hp:barrel?1:30,type:barrel?'barrel':'crate',dead:false});
  }
  // --- amaçlı odalar: her odanın bir işlevi var (boş oda yok) ---
  const roomTypes=['armory','medbay','generator','archive','storage','dorm'];
  let archives=0,lockers=0;
  for(const rm of ruins){
    if(rm.w<5||rm.h<5)continue;
    const spots=[];
    for(let ty=rm.y0+1;ty<rm.y0+rm.h-1;ty++)for(let tx=rm.x0+1;tx<rm.x0+rm.w-1;tx++)
      if(!tileAt(tx,ty)&&reach[ty*MW+tx]&&!propAt((tx+0.5)*TILE,(ty+0.5)*TILE,7))
        spots.push({x:(tx+0.5)*TILE,y:(ty+0.5)*TILE});
    if(spots.length<3)continue;
    const take=()=>spots.splice(RI(0,spots.length-1),1)[0];
    // oda teması compound planından gelir (mantıklı gruplama); yoksa rastgele
    const type=rm.theme||roomTypes[RI(0,roomTypes.length-1)];
    if(type==='armory'){
      for(let i=0;i<2;i++){const s=take(); pickups.push({x:s.x,y:s.y,type:'ammo',val:0,bob:R(0,TAU)});}
      const s=take(); props.push({x:s.x,y:s.y,r:6,hp:30,type:'crate',dead:false});
      if(rand()<0.4&&spots.length){const s2=take(); props.push({x:s2.x,y:s2.y,r:6,hp:1,type:'locker',dead:false}); lockers++;}
    } else if(type==='medbay'){
      for(let i=0;i<2;i++){const s=take(); pickups.push({x:s.x,y:s.y,type:'med',val:0,bob:R(0,TAU)});}
      const s=take(); props.push({x:s.x,y:s.y,r:7,hp:1,type:'corpse',dead:false,lore:LORE[RI(0,LORE.length-1)]});
    } else if(type==='generator'){
      for(let i=0;i<2&&spots.length;i++){const s=take(); props.push({x:s.x,y:s.y,r:6,hp:1,type:'barrel',dead:false});}
      const s=take(); props.push({x:s.x,y:s.y,r:4,hp:1,type:'lamp',dead:false,ph:R(0,TAU)});
    } else if(type==='archive'){
      const s=take(); props.push({x:s.x,y:s.y,r:6,hp:1,type:'terminal',dead:false,used:false}); archives++;
      if(spots.length){const s2=take(); props.push({x:s2.x,y:s2.y,r:6,hp:30,type:'crate',dead:false});}
    } else if(type==='storage'){
      for(let i=0;i<3&&spots.length;i++){const s=take(); props.push({x:s.x,y:s.y,r:6,hp:30,type:'crate',dead:false});}
      if(rand()<0.55&&spots.length){const s=take(); props.push({x:s.x,y:s.y,r:6,hp:1,type:'locker',dead:false}); lockers++;}
    } else {
      const s=take(); props.push({x:s.x,y:s.y,r:7,hp:1,type:'corpse',dead:false,lore:LORE[RI(0,LORE.length-1)]});
      if(spots.length){const s2=take(); pickups.push({x:s2.x,y:s2.y,type:'credit',val:Math.round(RI(30,80)*SEC.loot),bob:R(0,TAU)});}
      if(spots.length){const s3=take(); props.push({x:s3.x,y:s3.y,r:4,hp:1,type:'lamp',dead:false,ph:R(0,TAU)});}
    }
  }
  // garanti: her raid'de en az 1 terminal ve 1 kilitli konteyner
  if(!archives){const t=randReachTile(10,spawn.x,spawn.y); props.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:6,hp:1,type:'terminal',dead:false,used:false});}
  if(!lockers){const t=randReachTile(12,spawn.x,spawn.y); props.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:6,hp:1,type:'locker',dead:false});}
  // anomaliler: çoğunluk "anomali sahası" çeyreğinde kümelenir (mantıklı kirli
  // bölge), azınlık haritaya serpilir — böylece derin loot bir yere yoğunlaşır
  const inQuad=(t)=>t.x>=anomZone.x0&&t.x<anomZone.x0+anomZone.w&&t.y>=anomZone.y0&&t.y<anomZone.y0+anomZone.h;
  for(let i=0;i<SEC.anomalies;i++){
    let t=null;
    if(i<Math.ceil(SEC.anomalies*0.65)){
      for(let tr=0;tr<60;tr++){ const c=randReachTile(10,spawn.x,spawn.y); if(inQuad(c)){t=c;break;} }
    }
    if(!t)t=randReachTile(14,spawn.x,spawn.y);
    anomalies.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:R(55,85),type:rand()<0.55?'rad':'grav',ph:R(0,TAU)});
  }
  // artefaktlar (anomali yanı — risk/ödül) + elit muhafız — en az 1 GARANTİLİ
  let guard=null, placedArt=0;
  for(let i=0;i<3;i++){
    for(let tries=0;tries<20;tries++){
      const a=anomalies[RI(0,anomalies.length-1)];
      const ang=R(0,TAU), d=a.r+R(14,30);
      const ax=a.x+Math.cos(ang)*d, ay=a.y+Math.sin(ang)*d;
      if(hitSolid(ax,ay,5))continue;
      pickups.push({x:ax,y:ay,type:'artifact',val:Math.round(350*SEC.loot),bob:R(0,TAU)});
      placedArt++;
      if(!guard)guard={x:ax+20,y:ay+20};
      break;
    }
  }
  if(!placedArt){
    const t=randReachTile(15,spawn.x,spawn.y);
    pickups.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,type:'artifact',val:Math.round(350*SEC.loot),bob:0});
  }
  // düşmanlar
  for(let i=0;i<SEC.soldiers;i++){
    const t=randReachTile(16,spawn.x,spawn.y);
    enemies.push(mkSoldier((t.x+0.5)*TILE,(t.y+0.5)*TILE));
  }
  for(let p=0;p<SEC.packs;p++){
    const t=randReachTile(18,spawn.x,spawn.y);
    for(let j=0;j<3;j++)enemies.push(mkHound((t.x+0.5)*TILE+R(-10,10),(t.y+0.5)*TILE+R(-10,10)));
  }
  for(let i=0;i<SEC.suiciders;i++){
    const t=randReachTile(15,spawn.x,spawn.y);
    enemies.push(mkSuicider((t.x+0.5)*TILE,(t.y+0.5)*TILE));
  }
  if(SEC.elites>0&&guard&&!hitSolid(guard.x,guard.y,9))enemies.push(mkElite(guard.x,guard.y));
  for(let i=1;i<SEC.elites;i++){
    const t=randReachTile(17,spawn.x,spawn.y);
    enemies.push(mkElite((t.x+0.5)*TILE,(t.y+0.5)*TILE));
  }
  // tier'a özgü yeni düşmanlar (kural öğretir, sayı şişirmez)
  const dg=SEC.danger;
  if(dg>=3){ for(let i=0;i<dg-1;i++){ const t=randReachTile(16,spawn.x,spawn.y); enemies.push(mkShield((t.x+0.5)*TILE,(t.y+0.5)*TILE)); } }
  if(dg>=3){ for(let i=0;i<dg-2;i++){ const t=randReachTile(16,spawn.x,spawn.y); enemies.push(mkSpitter((t.x+0.5)*TILE,(t.y+0.5)*TILE)); } }
  if(dg>=4){ for(let i=0;i<dg-3;i++){ const t=randReachTile(18,spawn.x,spawn.y); enemies.push(mkDrone((t.x+0.5)*TILE,(t.y+0.5)*TILE)); } }
  // bölge tehlikesi: T2+ alarm kulesi (yıkmazsan takviye çağırır)
  if(dg>=2){
    const t=randReachTile(20,spawn.x,spawn.y);
    props.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:6,hp:60,type:'alarm',dead:false,cd:22,ph:R(0,TAU)});
  }
  // bölge tehlikesi: T3+ zehir gölcükleri
  if(dg>=3)for(let i=0;i<dg;i++){
    const t=randReachTile(12,spawn.x,spawn.y);
    hazards.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,r:R(26,40),ph:R(0,TAU)});
  }
  // THE SOURCE — T5 final boss
  if(SEC===SECTORS[4]){
    const t=randReachTile(30,spawn.x,spawn.y);
    enemies.push(mkBoss((t.x+0.5)*TILE,(t.y+0.5)*TILE));
  }
  // --- dinamik olay planı (raid başına 1) ---
  raidEvent={t:R(35,75),type:['storm','blackout','hunters'][RI(0,2)],warned:false,done:false};
  // --- nadir raid modifikatörü (%22, günlük modda sabit: seed'e bağlı) ---
  raidMod=null;
  if(rand()<0.22){
    const mk=['sis','kizilay','dusukg'][RI(0,2)];
    raidMod={k:mk};
    if(mk==='kizilay'){
      const extra=Math.ceil(SEC.soldiers*0.4);
      for(let i=0;i<extra;i++){ const t=randReachTile(16,spawn.x,spawn.y); enemies.push(mkSoldier((t.x+0.5)*TILE,(t.y+0.5)*TILE)); }
      for(let p=0;p<SEC.packs;p++){ const t=randReachTile(18,spawn.x,spawn.y); for(let j=0;j<2;j++)enemies.push(mkHound((t.x+0.5)*TILE+R(-10,10),(t.y+0.5)*TILE+R(-10,10))); }
    }
  }
  // The Collector: önceki ölümlerin ganimetini taşır (günlük modda gelmez)
  if(!dailyMode&&save.lostLoot&&(save.lostLoot.credits>0||save.lostLoot.arts>0)){
    const t=randReachTile(20,spawn.x,spawn.y);
    enemies.push(mkCollector((t.x+0.5)*TILE,(t.y+0.5)*TILE));
  }
  // loot: kredi + malzeme
  for(let i=0;i<26;i++){
    const t=randReachTile(6,spawn.x,spawn.y);
    const roll=rand();
    const type=roll<0.6?'credit':roll<0.8?'ammo':'med';
    pickups.push({x:(t.x+0.5)*TILE,y:(t.y+0.5)*TILE,type,val:type==='credit'?Math.round(RI(20,70)*SEC.loot):0,bob:R(0,TAU)});
  }
  // --- dinamik raid görevleri ---
  const objPool=[
    {id:'kills',txt:'Bölgeyi temizle',need:6+SEC.danger*2},
    {id:'terminal',txt:'Terminal hackle',need:1},
    {id:'artifact',txt:'Artefakt topla',need:1},
    {id:'locker',txt:'Kilitli konteyner aç',need:1},
  ];
  objectives=[];
  while(objectives.length<2){
    const o=objPool.splice(RI(0,objPool.length-1),1)[0];
    o.have=0; o.done=false; o.reward=Math.round(150*SEC.loot);
    objectives.push(o);
  }
  nearInteract=null; lowBeatT=0; dmgDirs=[];
  // günlük modda eklenti yok — seed gibi loadout da herkes için eşit
  player.attach=dailyMode?{}:JSON.parse(JSON.stringify(save.attach||{}));
  state='play';
  addMsg((dailyMode?'GÜNLÜK ZONE · ':'')+SEC.tier+' — '+SEC.name.toUpperCase()+'  ·  TEHLİKE '+'◆'.repeat(SEC.danger));
  if(dailyMode)addMsg('Seed herkes için aynı — skorun: çıkardığın kredi.');
  else { const st=storyStep(); if(st&&st.sec===save.sector)addMsg('» '+st.txt); }
  if(SEC===SECTORS[4]){ addMsg('!! ÇEKİRDEK SİNYALİ: THE SOURCE bu bölgede. !!'); markAch('deep'); }
  if(raidMod){ const m=RAIDMODS[raidMod.k]; addMsg('◈ ANOMALİ KOŞULU: '+m.name+' — '+m.desc); if(raidMod.k==='sis')ambBonus=Math.max(ambBonus,0.05); }
  if(!dailyMode&&save.lostLoot&&(save.lostLoot.credits>0||save.lostLoot.arts>0))
    addMsg('İSTİHBARAT: The Collector sahada — kaybettiğin '+save.lostLoot.credits+' kr onda.');
  addMsg('GÖREV: Ganimet topla, canlı çık. Extraction işaretli noktada.');
  addMsg('Zone seni izliyor...');
}

      col:['#ffdf8a','#ff9a4a','#e04a1a','#555'][RI(0,3)],size:R(2,4),fric:4});
  }
  if(decals.length<400)decals.push({x,y,r:r*0.5,col:'rgba(15,15,18,0.6)'});
  noiseEvent(x,y,380);
  if(player&&state==='play'){
    const d=dist(x,y,player.x,player.y);
    if(d<r&&player.inv<=0)damagePlayer(dmg*(1-d/r)+6,'Patlama',x,y);
  }
  for(const e of enemies){
    if(e.hp<=0)continue;
    const d=dist(x,y,e.x,e.y);
    if(d<r)hurtEnemy(e,dmg*(1-d/r)+8,x,y);
  }
  if(chain<2)for(const p of props){
    if(p.dead||p.type!=='barrel')continue;
    const d=dist(x,y,p.x,p.y);
    if(d<r&&d>1){ p.dead=true; explosion(p.x,p.y,52,55,chain+1); }
  }
}
function hurtEnemy(e,dmg,fx,fy){
  // kalkanlı asker: önden gelen mermiye bağışık (flank gerekir)
  if(e.shield&&fx!==undefined){
    const inc=Math.atan2(e.y-fy,e.x-fx); // merminin gidiş yönü
    if(Math.abs(angDiff(e.face,inc))<0.95){ sparks(fx,fy,4,'#9fd8ff'); e.flash=0.05; return; }
  }
  e.hp-=dmg;
  if(save.settings.dmgNums)floatDmg.push({x:e.x+R(-3,3),y:e.y-e.r-2,t:0.7,v:Math.round(dmg),crit:dmg>e.maxhp*0.4});
  blood(e.x,e.y,4);
  e.flash=0.08;
  // hasar alan düşman alarm olur
  if(e.kind==='sol'||e.kind==='elite'){ e.state='combat'; if(player){e.lastX=player.x;e.lastY=player.y;} }
  else if(e.kind==='col')e.spotted=true; // vurulan Collector kaçışa geçer
  else if(e.kind!=='boss')e.state='chase';
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return; e.dead=true;
